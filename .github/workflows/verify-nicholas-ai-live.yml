name: Verify Nicholas AI Live Backends

on:
  push:
    paths:
      - ".github/workflows/verify-nicholas-ai-live.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Verify public Switchboard v1.2 surface
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ENV="$HOME/.config/nicholas-ai-switchboard/deployment.env"
          test -f "$DEPLOY_ENV"
          source "$DEPLOY_ENV"
          test -n "${AI_SWITCHBOARD_URL:-}"
          curl -fsS "$AI_SWITCHBOARD_URL/health" > "$RUNNER_TEMP/health.json"
          curl -fsS "$AI_SWITCHBOARD_URL/openapi.json" > "$RUNNER_TEMP/openapi.json"
          python3 - "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/openapi.json" <<'PY'
          import json,sys
          health=json.load(open(sys.argv[1],encoding='utf-8'))
          schema=json.load(open(sys.argv[2],encoding='utf-8'))
          assert health.get('ok') is True, health
          assert health.get('version') == '1.2.0', health
          assert health.get('hermes_jobs') is True, health
          paths=schema.get('paths') or {}
          expected={
            '/health':'switchboardHealth',
            '/models':'switchboardModels',
            '/ask':'switchboardAsk',
            '/tools/route':'routeNicholasTool',
            '/hermes/jobs':'createHermesJob',
            '/hermes/jobs/{job_id}':'getHermesJob',
          }
          methods={
            '/health':'get','/models':'get','/ask':'post','/tools/route':'post',
            '/hermes/jobs':'post','/hermes/jobs/{job_id}':'get',
          }
          for path,op in expected.items():
            got=(paths.get(path) or {}).get(methods[path],{}).get('operationId')
            assert got==op, (path,got,op)
          print('SWITCHBOARD_PUBLIC_V12=PASS')
          print('SWITCHBOARD_ACTION_OPERATIONS=6')
          PY

      - name: Verify Ox and Qwen directly through existing OpenRouter credential
        shell: bash
        run: |
          set -euo pipefail
          set +x
          AUTH_FILE="$HOME/.local/share/opencode/auth.json"
          test -f "$AUTH_FILE"
          OPENROUTER_KEY="$(python3 - "$AUTH_FILE" <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:
              print(''); raise SystemExit
          entry=data.get('openrouter') if isinstance(data,dict) else None
          key=entry.get('key') if isinstance(entry,dict) else ''
          print(key.strip() if isinstance(key,str) else '')
          PY
          )"
          test -n "$OPENROUTER_KEY"

          verify_model () {
            model="$1"
            token="$2"
            slug="$3"
            req="$RUNNER_TEMP/${slug}-direct-request.json"
            resp="$RUNNER_TEMP/${slug}-direct-response.json"
            python3 - "$req" "$model" "$token" <<'PY'
          import json,sys
          path,model,token=sys.argv[1:]
          json.dump({
            'model':model,
            'messages':[
              {'role':'system','content':'Return only the exact token requested by the user, with no punctuation or extra text.'},
              {'role':'user','content':f'Return exactly {token}'},
            ],
            'max_tokens':128,
            'stream':False,
          },open(path,'w',encoding='utf-8'))
          PY
            code="$(curl -sS -o "$resp" -w '%{http_code}' \
              -H "Authorization: Bearer $OPENROUTER_KEY" \
              -H "Content-Type: application/json" \
              --data-binary "@$req" \
              https://openrouter.ai/api/v1/chat/completions || true)"
            test "$code" = "200"
            python3 - "$resp" "$token" "$slug" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          expected,slug=sys.argv[2:]
          text=str((((p.get('choices') or [{}])[0].get('message') or {}).get('content')) or '').strip()
          assert text==expected, {'expected':expected,'actual':text[:120],'model':p.get('model')}
          print(f'{slug.upper()}_BACKEND_LIVE=PASS response_model={p.get("model")}')
          PY
          }

          verify_model 'z-ai/glm-5.3' 'OX_BACKEND_OK' 'ox'
          verify_model 'qwen/qwen3.8-2.4t-a95b' 'QWEN_BACKEND_OK' 'qwen'
          unset OPENROUTER_KEY

      - name: Verify Hermes through authenticated persistent worker queue
        shell: bash
        run: |
          set -euo pipefail
          set +x
          DEPLOY_ENV="$HOME/.config/nicholas-ai-switchboard/deployment.env"
          WORKER_KEY_FILE="$HOME/.config/nicholas-ai-switchboard/hermes-worker.key"
          WORKER_BIN="$HOME/.local/share/nicholas-ai/hermes_switchboard_worker.py"
          test -f "$DEPLOY_ENV"
          test -s "$WORKER_KEY_FILE"
          test -f "$WORKER_BIN"
          source "$DEPLOY_ENV"
          WORKER_KEY="$(cat "$WORKER_KEY_FILE")"
          test -n "$WORKER_KEY"

          python3 - "$RUNNER_TEMP/hermes-create.json" <<'PY'
          import json,sys
          json.dump({
            'task':'This is a live backend diagnostic. Do not use tools and do not take actions. Return exactly HERMES_BACKEND_OK',
            'timeout_seconds':300,
          },open(sys.argv[1],'w',encoding='utf-8'))
          PY

          public_code="$(curl -sS -o "$RUNNER_TEMP/hermes-public-unauth.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/hermes-create.json" \
            "$AI_SWITCHBOARD_URL/hermes/jobs" || true)"
          test "$public_code" = "401"
          echo 'HERMES_PUBLIC_AUTH_BARRIER=PASS'

          curl -fsS \
            -H "Authorization: Bearer $WORKER_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/hermes-create.json" \
            "$AI_SWITCHBOARD_URL/hermes/internal/jobs" > "$RUNNER_TEMP/hermes-created.json"
          JOB_ID="$(python3 - "$RUNNER_TEMP/hermes-created.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True,d
          j=d.get('job') or {}
          assert j.get('status')=='queued',j
          print(j['id'])
          PY
          )"
          test -n "$JOB_ID"

          success=0
          for _ in $(seq 1 60); do
            curl -fsS \
              -H "Authorization: Bearer $WORKER_KEY" \
              "$AI_SWITCHBOARD_URL/hermes/internal/jobs/$JOB_ID" > "$RUNNER_TEMP/hermes-result.json"
            state="$(python3 - "$RUNNER_TEMP/hermes-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print((d.get('job') or {}).get('status') or '')
          PY
            )"
            if [ "$state" = "completed" ]; then
              success=1
              break
            fi
            if [ "$state" = "failed" ]; then
              echo 'HERMES_BACKEND_LIVE=FAIL job_status=failed'
              exit 1
            fi
            /usr/bin/python3 "$WORKER_BIN" >/dev/null 2>&1 || true
            sleep 5
          done
          test "$success" = "1"

          python3 - "$RUNNER_TEMP/hermes-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') is True,d
          j=d.get('job') or {}
          assert j.get('status')=='completed',j
          result=str(j.get('result') or '').strip()
          assert result=='HERMES_BACKEND_OK', {'status':j.get('status'),'result':result[:200]}
          assert j.get('profile')=='research_readonly',j
          print('HERMES_BACKEND_LIVE=PASS')
          print('HERMES_PROFILE=research_readonly')
          PY
          unset WORKER_KEY

      - name: Persist sanitized live verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" > status/nicholas-ai-live-backends.json <<'PY'
          import json,sys
          from datetime import datetime,timezone
          print(json.dumps({
            'status':'verified',
            'verified_at':datetime.now(timezone.utc).isoformat(),
            'tested_commit':sys.argv[1],
            'workflow_run_id':sys.argv[2],
            'switchboard_public_v1_2':'pass',
            'action_operation_count':6,
            'ox_backend':'pass',
            'qwen_backend':'pass',
            'hermes_backend':'pass',
            'hermes_profile':'research_readonly',
            'hermes_public_auth_barrier':'pass',
            'gpt_bearer_local_keychain_copy':'missing_on_runner_as_of_previous_test',
            'gpt_bearer_cloudflare_secret':'preserved_not_rotated',
            'rube_app_path':'separate_from_switchboard',
            'secrets_recorded':False,
          },indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/nicholas-ai-live-backends.json
          git commit -m "Nicholas AI live backends: verified" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
