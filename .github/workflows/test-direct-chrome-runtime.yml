name: Test Direct Chrome Runtime

on:
  push:
    paths:
      - ".github/workflows/test-direct-chrome-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Test direct browser-client connection read-only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/.codex/plugins/cache/openai-bundled/chrome/26.825.51511"
          CLIENT="$ROOT/scripts/browser-client.mjs"
          NODE="/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
          test -f "$CLIENT"
          test -x "$NODE"
          PIPE="$(ls -t /tmp/codex-browser-use/*.sock 2>/dev/null | head -1 || true)"
          if [[ -z "$PIPE" ]]; then
            echo 'BROWSER_USE_PIPE=NOT_FOUND'
            exit 2
          fi
          echo 'BROWSER_USE_PIPE=FOUND'
          export CODEX_APP_TOOLS_PIPE_PATH="$PIPE"
          export CODEX_BROWSER_USE_NODE_PATH="$NODE"
          "$NODE" --input-type=module <<'JS'
          import { setupBrowserRuntime } from process.env.HOME + '/.codex/plugins/cache/openai-bundled/chrome/26.825.51511/scripts/browser-client.mjs';
          try {
            const agent = await setupBrowserRuntime();
            console.log('BROWSER_RUNTIME_SETUP=PASS');
            const chrome = await agent.browsers.get('chrome');
            console.log('CHROME_BINDING=PASS');
            const tabs = await chrome.tabs.list();
            console.log('CHROME_TABS_LIST=PASS');
            console.log('CHROME_TAB_COUNT=' + (Array.isArray(tabs) ? tabs.length : -1));
            // Only report sanitized title and origin/path; no page body, cookies, storage, or form data.
            if (Array.isArray(tabs)) {
              for (const t of tabs.slice(0,25)) {
                let u='';
                try {
                  const x=new URL(String(t.url||''));
                  u=x.origin+x.pathname;
                } catch {}
                console.log('TAB=' + JSON.stringify({id:t.id ?? null,title:String(t.title||'').slice(0,160),url:u}));
              }
            }
            console.log('DIRECT_CHROME_CONTROL=PASS');
          } catch (e) {
            console.log('DIRECT_CHROME_CONTROL=FAIL');
            console.log('ERROR_NAME=' + String(e?.name||''));
            console.log('ERROR_MESSAGE=' + String(e?.message||e).replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]').slice(0,2000));
            process.exit(3);
          }
          JS
