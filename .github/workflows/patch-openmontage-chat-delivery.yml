name: Patch OpenMontage Chat Delivery

on:
  push:
    paths:
      - 'scripts/patch_openmontage_chat_delivery.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bridge patch
        run: python3 scripts/patch_openmontage_chat_delivery.py

      - name: Verify patched worker compiles
        run: python3 -m py_compile scripts/openmontage_worker.py

      - name: Commit patched worker
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/openmontage_worker.py; then
            echo 'Worker already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/openmontage_worker.py
          git commit -m 'Add direct ChatGPT MP4 delivery bridge'
          git push
