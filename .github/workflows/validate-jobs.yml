name: Validate AI OS Jobs

on:
  push:
    paths:
      - 'jobs/**/*.json'
      - '.github/workflows/validate-jobs.yml'
  pull_request:
    paths:
      - 'jobs/**/*.json'
      - '.github/workflows/validate-jobs.yml'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate job JSON files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(jobs/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No job JSON files found; validation passed."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python -m json.tool "$file" >/dev/null
          done

      - name: Check schema-specific required fields
        shell: python
        run: |
          import glob, json, sys

          legacy_required = {"workflow_id", "request", "created_at"}
          openmontage_required = {
              "id", "type", "status", "project_id", "brief", "output_filename"
          }
          openmontage_statuses = {"queued", "running", "completed", "failed"}
          failures = []

          for path in glob.glob("jobs/**/*.json", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              is_openmontage = (
                  data.get("type") == "openmontage_video"
                  or path.startswith("jobs/openmontage/")
              )
              required = openmontage_required if is_openmontage else legacy_required
              missing = sorted(required - set(data))
              if missing:
                  failures.append(f"{path}: missing {', '.join(missing)}")
                  continue

              if is_openmontage and data.get("type") != "openmontage_video":
                  failures.append(f"{path}: type must be openmontage_video")
              if is_openmontage and data.get("status") not in openmontage_statuses:
                  failures.append(
                      f"{path}: invalid status {data.get('status')!r}; "
                      f"expected one of {sorted(openmontage_statuses)}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All job files satisfy their schema-specific requirements.")
