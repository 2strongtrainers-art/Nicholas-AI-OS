name: Casper Bojan Crypto Backtest

on:
  pull_request:
    paths:
      - 'research/casper-bojan-paperbot/**'
      - '.github/workflows/casper-bojan-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Syntax and unit tests
        run: |
          python -m py_compile research/casper-bojan-paperbot/src/bot.py research/casper-bojan-paperbot/backtest.py
          python research/casper-bojan-paperbot/tests/test_bot.py
          python research/casper-bojan-paperbot/tests/test_backtest.py
      - name: Assert paper-only execution boundary
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('research/casper-bojan-paperbot')
          spec = importlib.util.spec_from_file_location('cb_backtest', root / 'backtest.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.LIVE_EXECUTION_ENABLED is False
          source = '\n'.join(p.read_text(errors='ignore') for p in root.rglob('*.py')).lower()
          forbidden = ('submit_order', 'create_order', '/orders', 'tradingclient', 'api_secret', 'private_key')
          assert not any(token in source for token in forbidden), 'live/private trading capability detected'
          print('paper-only boundary verified')
          PY
      - name: Run fixed BTC ETH historical backtest
        run: |
          mkdir -p results/casper-bojan
          python research/casper-bojan-paperbot/backtest.py \
            --start 2026-02-26T00:00:00Z \
            --end 2026-08-24T23:55:00Z \
            --out results/casper-bojan | tee results/casper-bojan-ci.log
      - name: Run untouched prior-window falsification
        run: |
          mkdir -p results/casper-bojan-prior
          python research/casper-bojan-paperbot/backtest.py \
            --start 2025-08-29T00:00:00Z \
            --end 2026-02-25T23:55:00Z \
            --out results/casper-bojan-prior | tee results/casper-bojan-prior-ci.log
      - name: Upload reproducible research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casper-bojan-backtest-results
          path: |
            results/casper-bojan/
            results/casper-bojan-ci.log
            results/casper-bojan-prior/
            results/casper-bojan-prior-ci.log
          if-no-files-found: error
