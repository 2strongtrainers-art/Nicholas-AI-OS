name: Test ElevenLabs August Nick

on:
  push:
    paths:
      - 'tests/elevenlabs-secret-test.txt'
      - 'scripts/test_elevenlabs.py'
      - '.github/workflows/test-elevenlabs.yml'

jobs:
  test-august-nick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Synthesize short August Nick sample
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/test_elevenlabs.py

      - name: Validate MP3
        run: |
          set -euo pipefail
          test -s output/august-nick-secret-test.mp3
          python3 - <<'PY'
          from pathlib import Path
          p = Path('output/august-nick-secret-test.mp3')
          print(f'August Nick MP3 bytes: {p.stat().st_size}')
          assert p.stat().st_size > 1000
          PY

      - name: Upload August Nick test artifact
        uses: actions/upload-artifact@v6
        with:
          name: august-nick-secret-test-${{ github.run_id }}
          path: |
            output/august-nick-secret-test.mp3
            output/august-nick-secret-test.json
          if-no-files-found: error
          retention-days: 7
