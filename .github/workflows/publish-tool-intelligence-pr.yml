name: Publish Tool Intelligence PR Branch

on:
  push:
    branches:
      - ops/publish-tool-intelligence-pr
    paths:
      - .github/workflows/publish-tool-intelligence-pr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-export:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out control branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate local integration worktree
        shell: bash
        run: |
          set -euo pipefail
          WT="$HOME/Nicholas-AI-OS-node24-tool-intelligence"
          EXPECTED_BRANCH="codex/hermes-tool-intelligence-node24"
          test -d "$WT"
          git -C "$WT" rev-parse --is-inside-work-tree >/dev/null
          BRANCH="$(git -C "$WT" branch --show-current)"
          echo "LOCAL_BRANCH=$BRANCH"
          echo "LOCAL_HEAD=$(git -C "$WT" rev-parse --short HEAD)"
          test "$BRANCH" = "$EXPECTED_BRANCH"
          rm -rf "$WT/tests/__pycache__" "$WT/tool_intelligence/__pycache__" "$WT/.pytest_cache"
          STATUS="$(git -C "$WT" status --porcelain)"
          if [[ -n "$STATUS" ]]; then
            echo "Local integration worktree is not clean:" >&2
            printf '%s\n' "$STATUS" >&2
            exit 1
          fi
          echo "Local integration worktree is clean."

      - name: Rebase safely onto current origin main if needed
        shell: bash
        run: |
          set -euo pipefail
          WT="$HOME/Nicholas-AI-OS-node24-tool-intelligence"
          ASKPASS="$RUNNER_TEMP/nicholas-ai-fetch-askpass.sh"
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git -C "$WT" fetch --no-tags https://github.com/2strongtrainers-art/Nicholas-AI-OS.git refs/heads/main
          git -C "$WT" update-ref refs/remotes/origin/main FETCH_HEAD
          rm -f "$ASKPASS"
          if git -C "$WT" merge-base --is-ancestor origin/main HEAD; then
            echo "Integration branch already contains current origin/main."
          else
            echo "origin/main advanced; rebasing integration branch."
            if ! git -C "$WT" rebase origin/main; then
              git -C "$WT" rebase --abort || true
              echo "Rebase failed and was aborted; integration branch left local." >&2
              exit 1
            fi
          fi
          test -z "$(git -C "$WT" status --porcelain)"
          echo "CURRENT_MAIN=$(git -C "$WT" rev-parse --short origin/main)"
          echo "REBASING_HEAD=$(git -C "$WT" rev-parse --short HEAD)"
          echo "AHEAD_COUNT=$(git -C "$WT" rev-list --count origin/main..HEAD)"

      - name: Re-run focused Tool Intelligence checks
        shell: bash
        run: |
          set -euo pipefail
          WT="$HOME/Nicholas-AI-OS-node24-tool-intelligence"
          cd "$WT"
          if python3 -m pytest --version >/dev/null 2>&1; then
            PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q -p no:cacheprovider tests/test_tool_intelligence.py
          else
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_tool_intelligence.py'
          fi
          rm -rf tests/__pycache__ tool_intelligence/__pycache__ .pytest_cache
          ruby -e 'require "yaml"; files=Dir[".github/workflows/*.{yml,yaml}"]; files.each { |f| YAML.load_file(f) }; puts "WORKFLOW_YAML_PARSE_PASS=#{files.length}"'
          if grep -REn 'actions/(checkout@v4|setup-node@v4|setup-python@v5|github-script@v7|upload-artifact@v4)' .github/workflows; then
            echo "Obsolete GitHub JavaScript action pin found." >&2
            exit 1
          fi
          if grep -REn 'ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION' .github/workflows; then
            echo "Insecure Node runtime override found." >&2
            exit 1
          fi
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          echo "FOCUSED_VALIDATION=PASS"

      - name: Export validated integration snapshot
        shell: bash
        run: |
          set -euo pipefail
          WT="$HOME/Nicholas-AI-OS-node24-tool-intelligence"
          EXPORT_ROOT="$GITHUB_WORKSPACE/ops-export/tool-intelligence"
          rm -rf "$EXPORT_ROOT"
          mkdir -p "$EXPORT_ROOT/files"
          python3 - "$WT" "$EXPORT_ROOT" <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          wt = Path(sys.argv[1])
          out = Path(sys.argv[2])

          def git(*args: str, text=True):
              return subprocess.run(
                  ["git", "-C", str(wt), *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=text,
              ).stdout

          raw = git("diff", "--name-status", "-z", "origin/main...HEAD", text=False)
          fields = raw.split(b"\0")
          entries = []
          i = 0
          while i < len(fields) and fields[i]:
              status = fields[i].decode("utf-8", "replace")
              i += 1
              if status.startswith("R") or status.startswith("C"):
                  old_path = fields[i].decode("utf-8", "surrogateescape")
                  new_path = fields[i + 1].decode("utf-8", "surrogateescape")
                  i += 2
                  path = new_path
              else:
                  old_path = None
                  path = fields[i].decode("utf-8", "surrogateescape")
                  i += 1

              mode = None
              if not status.startswith("D"):
                  ls = git("ls-files", "-s", "--", path).strip()
                  mode = ls.split()[0] if ls else "100644"
                  src = wt / path
                  dst = out / "files" / path
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

              entries.append({
                  "status": status,
                  "path": path,
                  "old_path": old_path,
                  "mode": mode,
              })

          manifest = {
              "base_sha": git("rev-parse", "origin/main").strip(),
              "head_sha": git("rev-parse", "HEAD").strip(),
              "branch": git("branch", "--show-current").strip(),
              "ahead_count": int(git("rev-list", "--count", "origin/main..HEAD").strip()),
              "entries": entries,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"EXPORTED_FILES={sum(1 for e in entries if not e['status'].startswith('D'))}")
          print(f"EXPORTED_ENTRIES={len(entries)}")
          print(f"EXPORTED_HEAD={manifest['head_sha']}")
          PY

          git config user.name "Nicholas Integration Export"
          git config user.email "actions@users.noreply.github.com"
          git add ops-export/tool-intelligence
          if git diff --cached --quiet; then
            echo "Validated export already current."
          else
            git commit -m "ops: export validated tool intelligence integration"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          test -f "$EXPORT_ROOT/manifest.json"
          echo "VALIDATED_EXPORT=PASS"
