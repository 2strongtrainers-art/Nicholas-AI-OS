name: Host August Nick Audio

on:
  push:
    paths:
      - 'jobs/host-august-audio-*.txt'
      - '.github/workflows/host-august-audio.yml'

jobs:
  host-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate August Nick MP3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          voice='eZ6srIcJSJNcqcDrI68r'
          text="Hi, I'm Nicholas Kaplan with TriValley.fit. I help people improve body composition, build strength, and create a training plan they can actually sustain. My coaching combines intelligent programming, accountability, and real-world strategy so progress is measurable and realistic. If you're ready to look better, feel better, and perform at a higher level, TriValley.fit is built for you. Train with purpose. Perform at your best."
          payload={"text":text,"model_id":"eleven_multilingual_v2","voice_settings":{"stability":0.40,"similarity_boost":0.85,"style":0.0,"use_speaker_boost":True,"speed":1.03}}
          req=urllib.request.Request(f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',data=json.dumps(payload).encode(),method='POST',headers={'xi-api-key':os.environ['ELEVENLABS_API_KEY'],'Content-Type':'application/json','Accept':'audio/mpeg'})
          with urllib.request.urlopen(req,timeout=90) as r: open('august-nick.mp3','wb').write(r.read())
          PY
      - name: Upload MP3 to Wix signed URL
        env:
          WIX_UPLOAD_URL: 'https://upload.wixmp.com/upload/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.' 
        run: |
          set -euo pipefail
          curl -sS -X PUT "$WIX_UPLOAD_URL" -H 'Content-Type: audio/mpeg' --data-binary @august-nick.mp3 | tee wix-upload-response.json
          echo '---WIX_RESPONSE---'
          cat wix-upload-response.json
      - name: Upload debug response
        uses: actions/upload-artifact@v4
        with:
          name: august-audio-host-${{ github.run_id }}
          path: |
            august-nick.mp3
            wix-upload-response.json
