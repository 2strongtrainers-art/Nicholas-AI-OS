name: Host August Nick Audio

on:
  push:
    paths:
      - 'jobs/host-august-audio-*.txt'

jobs:
  host-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate August Nick MP3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          INPUT="$(ls -1t jobs/host-august-audio-*.txt | head -1)"
          export AUGUST_SCRIPT="$(cat "$INPUT")"
          python3 - <<'PY'
          import json, os, urllib.request
          voice = 'eZ6srIcJSJNcqcDrI68r'
          text = os.environ['AUGUST_SCRIPT'].strip()
          if not text:
              raise SystemExit('Audio script is empty')
          payload = {
              'text': text,
              'model_id': 'eleven_multilingual_v2',
              'voice_settings': {
                  'stability': 0.40,
                  'similarity_boost': 0.85,
                  'style': 0.0,
                  'use_speaker_boost': True,
                  'speed': 1.03,
              },
          }
          req = urllib.request.Request(
              f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'xi-api-key': os.environ['ELEVENLABS_API_KEY'],
                  'Content-Type': 'application/json',
                  'Accept': 'audio/mpeg',
              },
          )
          with urllib.request.urlopen(req, timeout=90) as r:
              open('august-nick.mp3', 'wb').write(r.read())
          if os.path.getsize('august-nick.mp3') < 1000:
              raise SystemExit('Generated MP3 is unexpectedly small')
          print({'bytes': os.path.getsize('august-nick.mp3')})
          PY
      - name: Publish latest voiceover into private repo
        run: |
          set -euo pipefail
          mkdir -p generated/audio
          cp august-nick.mp3 generated/audio/august-nick-latest.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/audio/august-nick-latest.mp3
          git commit -m 'Publish latest August Nick voiceover' || exit 0
          git push
      - name: Upload August Nick audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: august-audio-${{ github.run_id }}
          path: august-nick.mp3
          retention-days: 7
