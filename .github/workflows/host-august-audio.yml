name: Host August Nick Audio

on:
  push:
    paths:
      - 'jobs/host-august-audio-*.txt'

jobs:
  host-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve exact triggering script
        shell: bash
        run: |
          set -euo pipefail
          INPUT="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^jobs/host-august-audio-.*\.txt$' | head -1 || true)"
          if [ -z "$INPUT" ]; then
            echo 'No August Nick script changed in triggering commit.' >&2
            exit 1
          fi
          test -s "$INPUT"
          echo "AUGUST_INPUT=$INPUT" >> "$GITHUB_ENV"
          echo "AUGUST_STEM=$(basename "$INPUT" .txt)" >> "$GITHUB_ENV"
          echo "Resolved voice script: $INPUT"
      - name: Generate canonical August Nick MP3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          export AUGUST_SCRIPT="$(cat "$AUGUST_INPUT")"
          python3 - <<'PY'
          import json, os, urllib.request
          voice = 'eZ6srIcJSJNcqcDrI68r'
          text = os.environ['AUGUST_SCRIPT'].strip()
          if not text:
              raise SystemExit('Audio script is empty')
          payload = {
              'text': text,
              'model_id': 'eleven_multilingual_v2',
              'voice_settings': {
                  'stability': 0.45,
                  'similarity_boost': 0.85,
                  'style': 0.20,
                  'use_speaker_boost': True,
                  'speed': 1.10,
              },
          }
          req = urllib.request.Request(
              f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'xi-api-key': os.environ['ELEVENLABS_API_KEY'],
                  'Content-Type': 'application/json',
                  'Accept': 'audio/mpeg',
              },
          )
          with urllib.request.urlopen(req, timeout=90) as r:
              open('august-nick.mp3', 'wb').write(r.read())
          if os.path.getsize('august-nick.mp3') < 1000:
              raise SystemExit('Generated MP3 is unexpectedly small')
          print({'bytes': os.path.getsize('august-nick.mp3'), 'voice': 'August Nick', 'format': 'mp3_44100_128'})
          PY
      - name: Verify and publish script-bound voiceover
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size -of json august-nick.mp3
          mkdir -p generated/audio
          cp august-nick.mp3 "generated/audio/${AUGUST_STEM}.mp3"
          cp "$AUGUST_INPUT" "generated/audio/${AUGUST_STEM}.txt"
          sha256sum "generated/audio/${AUGUST_STEM}.mp3" > "generated/audio/${AUGUST_STEM}.sha256"
          cp august-nick.mp3 generated/audio/august-nick-reel.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/audio
          git commit -m "Publish August Nick audio for ${AUGUST_STEM}" || exit 0
          git pull --rebase
          git push
      - name: Upload canonical voiceover artifact
        uses: actions/upload-artifact@v4
        with:
          name: august-nick-voice-${{ github.run_id }}
          path: august-nick.mp3
          retention-days: 7
