name: Probe ChatGPT Auth via Trusted Chrome

on:
  push:
    paths:
      - "scripts/probe_chatgpt_auth_via_trusted_chrome.py"
      - ".github/workflows/probe-chatgpt-auth-via-trusted-chrome.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Probe trusted Chrome ChatGPT auth state
        shell: bash
        run: python3 scripts/probe_chatgpt_auth_via_trusted_chrome.py
      - name: Commit non-secret auth state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/chatgpt-trusted-chrome-auth.json
          git commit -m 'Record trusted Chrome ChatGPT auth state' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
