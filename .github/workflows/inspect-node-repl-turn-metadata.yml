name: Inspect Node REPL Turn Metadata

on:
  push:
    paths:
      - ".github/workflows/inspect-node-repl-turn-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 4
    steps:
      - name: Inspect metadata key names only
        shell: bash
        run: |
          set -euo pipefail
          BIN="/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
          echo '=== matching binary strings ==='
          strings "$BIN" | grep -Ei -C 4 'Missing required Codex turn metadata|session_id|turn_id|requestMeta' | head -240 || true
          echo '=== browser client metadata references ==='
          ROOT="$HOME/.codex/plugins/cache/openai-bundled/chrome/26.825.51511"
          grep -RInE 'session_id|turn_id|requestMeta|request_meta|_meta' "$ROOT/scripts" "$ROOT/docs" 2>/dev/null | head -240 || true
