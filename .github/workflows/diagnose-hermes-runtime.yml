name: Diagnose Hermes Runtime

on:
  push:
    paths:
      - ".github/workflows/diagnose-hermes-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Run Hermes through free OpenRouter route
        shell: bash
        run: |
          set -euo pipefail
          set +x
          HERMES="$HOME/.local/bin/hermes"
          ROOT="$HOME/Nicholas-AI-OS"
          AUTH_FILE="$HOME/.local/share/opencode/auth.json"
          test -x "$HERMES"
          test -d "$ROOT"
          test -f "$AUTH_FILE"
          OPENROUTER_API_KEY="$(python3 - "$AUTH_FILE" <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:
              print(''); raise SystemExit
          entry=data.get('openrouter') if isinstance(data,dict) else None
          key=entry.get('key') if isinstance(entry,dict) else ''
          print(key.strip() if isinstance(key,str) else '')
          PY
          )"
          test -n "$OPENROUTER_API_KEY"
          export OPENROUTER_API_KEY
          export HERMES_MAX_TOKENS=4096
          OUT="$RUNNER_TEMP/hermes-runtime.out"
          ERR="$RUNNER_TEMP/hermes-runtime.err"
          USAGE="$RUNNER_TEMP/hermes-runtime-usage.json"
          set +e
          "$HERMES" \
            --provider openrouter \
            --model openrouter/free \
            --reasoning high \
            --toolsets search \
            --usage-file "$USAGE" \
            --oneshot 'This is a runtime smoke test. Do not use tools and do not take actions. Return exactly HERMES_FREE_OK' \
            >"$OUT" 2>"$ERR"
          code=$?
          set -e
          unset OPENROUTER_API_KEY HERMES_MAX_TOKENS
          python3 - "$OUT" "$ERR" "$code" <<'PY'
          import re,sys
          from pathlib import Path
          out=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').strip()
          err=Path(sys.argv[2]).read_text(encoding='utf-8',errors='replace').strip()
          code=int(sys.argv[3])
          def scrub(s):
              s=s.replace(str(Path.home()), '$HOME')
              s=re.sub(r'(?i)((?:api[_-]?key|token|authorization|secret)\s*[:=]\s*)\S+',r'\1[REDACTED]',s)
              return s[-2000:]
          if code != 0:
              print(f'HERMES_FREE_LIVE=FAIL exit={code}')
              print('HERMES_FREE_ERROR=' + scrub(err or out or 'no output'))
              raise SystemExit(1)
          if out.strip() != 'HERMES_FREE_OK':
              print('HERMES_FREE_LIVE=FAIL unexpected_output')
              print('HERMES_FREE_OUTPUT=' + scrub(out))
              raise SystemExit(1)
          print('HERMES_FREE_LIVE=PASS')
          print('HERMES_FREE_OUTPUT=HERMES_FREE_OK')
          PY
