name: Diagnose Hermes Runtime

on:
  push:
    paths:
      - ".github/workflows/diagnose-hermes-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Read sanitized Hermes worker diagnostics
        shell: bash
        run: |
          set -euo pipefail
          LOG="$HOME/Library/Logs/HermesSwitchboardWorker.log"
          python3 - "$LOG" <<'PY'
          import re,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.exists():
              print('HERMES_WORKER_LOG=missing')
              raise SystemExit
          text=path.read_text(encoding='utf-8',errors='replace')[-6000:]
          text=text.replace(str(Path.home()), '$HOME')
          text=re.sub(r'(?i)((?:api[_-]?key|token|authorization|secret)\s*[:=]\s*)\S+',r'\1[REDACTED]',text)
          print('HERMES_WORKER_LOG_SANITIZED_BEGIN')
          print(text)
          print('HERMES_WORKER_LOG_SANITIZED_END')
          PY

      - name: Run mirrored Hermes CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +x
          HERMES="$HOME/.local/bin/hermes"
          ROOT="$HOME/Nicholas-AI-OS"
          test -x "$HERMES"
          test -d "$ROOT"
          OUT="$RUNNER_TEMP/hermes-runtime.out"
          ERR="$RUNNER_TEMP/hermes-runtime.err"
          USAGE="$RUNNER_TEMP/hermes-runtime-usage.json"
          set +e
          "$HERMES" \
            --provider openai-codex \
            --model gpt-5.6-sol \
            --reasoning high \
            --toolsets search \
            --usage-file "$USAGE" \
            --oneshot 'This is a runtime smoke test. Do not use tools and do not take actions. Return exactly HERMES_RUNTIME_OK' \
            >"$OUT" 2>"$ERR"
          code=$?
          set -e
          python3 - "$OUT" "$ERR" "$code" <<'PY'
          import re,sys
          from pathlib import Path
          out=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').strip()
          err=Path(sys.argv[2]).read_text(encoding='utf-8',errors='replace').strip()
          code=int(sys.argv[3])
          def scrub(s):
              s=s.replace(str(Path.home()), '$HOME')
              s=re.sub(r'(?i)((?:api[_-]?key|token|authorization|secret)\s*[:=]\s*)\S+',r'\1[REDACTED]',s)
              return s[-2000:]
          if code != 0:
              print(f'HERMES_RUNTIME_LIVE=FAIL exit={code}')
              print('HERMES_RUNTIME_ERROR=' + scrub(err or out or 'no output'))
              raise SystemExit(1)
          if out.strip() != 'HERMES_RUNTIME_OK':
              print('HERMES_RUNTIME_LIVE=FAIL unexpected_output')
              print('HERMES_RUNTIME_OUTPUT=' + scrub(out))
              raise SystemExit(1)
          print('HERMES_RUNTIME_LIVE=PASS')
          print('HERMES_RUNTIME_OUTPUT=HERMES_RUNTIME_OK')
          PY
