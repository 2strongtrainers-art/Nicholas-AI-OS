name: TriValley openGym — free build and review
on:
  push:
    branches:
      - feat/trivalley-opengym-free-20261116
    paths:
      - 'apps/trivalley-opengym/**'
      - '.github/workflows/trivalley-opengym-free.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-open-gym:
    name: Build pinned OpenGym frontend without external exercise media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout TriValley build definitions
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone the exact screenshot repository source (no credentials)
        run: |
          git clone --filter=blob:none https://github.com/alexpcosta/opengym.git upstream
          git -C upstream checkout --detach 678bf5bf10446e8997a77d43e89c9b2721d8d0fc
          test "$(git -C upstream rev-parse HEAD)" = "678bf5bf10446e8997a77d43e89c9b2721d8d0fc"
      - name: Apply TriValley original-visuals and data-safety patch
        run: |
          python3 apps/trivalley-opengym/patch_opengym.py upstream/frontend
          python3 apps/trivalley-opengym/add_daily_verse.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_v4.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_v5.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_v6.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_programs.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_visuals.py upstream/frontend
          python3 apps/trivalley-opengym/fetch_covers.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_movement_illustrations.py upstream/frontend
          python3 apps/trivalley-opengym/fetch_movements.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_iphone.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_audit.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_setup.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_client_interface.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_navigation.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_client_value.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_coach_notes.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_calculators.py upstream/frontend
          python3 apps/trivalley-opengym/upgrade_workout_tools.py upstream/frontend
          curl --fail --location --silent --show-error --retry 2 --max-time 25 \
            'https://static.wixstatic.com/media/856ae2_c38d74eea9814eca8746480856abb82f~mv2.png' \
            -o upstream/frontend/public/trivalley-triquetra.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          path = Path('upstream/frontend/public/trivalley-triquetra.png')
          raw = path.read_bytes()
          assert raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw) < 150000, 'Logo asset must be a small valid PNG'
          assert struct.unpack('>II', raw[16:24]) == (72,72), 'Expected 72px reviewed triquetra'
          print('Brand source SHA-256:', hashlib.sha256(raw).hexdigest())
          PY
          cp apps/trivalley-opengym/branding/*.png upstream/frontend/public/
          mkdir -p upstream/frontend/public/assets
          curl --fail --location --silent --show-error --retry 2 --max-time 25 \
            'https://headless-lukuteamnwo-1strongtrainer-140e.wix-site-host.com/assets/tv-coach-portrait.webp' \
            -o upstream/frontend/public/assets/tv-coach-portrait.webp
          echo 'ef1b3e6367cf189731f9d26abb4dd73971391717a1e0e370614ba114b50c03b8  upstream/frontend/public/assets/tv-coach-portrait.webp' | sha256sum --check
      - name: Test deterministic exercise discovery and validated backup recovery
        env:
          TV_CATALOGUE_PATH: upstream/frontend/src/lib/exercises-data.js
        run: node --test apps/trivalley-opengym/tv-exercise-search.test.mjs apps/trivalley-opengym/tv-backup.test.mjs apps/trivalley-opengym/tv-training-insights.test.mjs apps/trivalley-opengym/tv-poster.test.mjs apps/trivalley-opengym/tv-programs.test.mjs apps/trivalley-opengym/tv-movement-illustrations.test.mjs apps/trivalley-opengym/tv-audit-safety.test.mjs apps/trivalley-opengym/tv-setup.test.mjs apps/trivalley-opengym/tv-navigation.test.mjs apps/trivalley-opengym/tv-weekly-progress.test.mjs apps/trivalley-opengym/tv-coach-notes.test.mjs apps/trivalley-opengym/tv-calculators.test.mjs apps/trivalley-opengym/tv-workout-tools.test.mjs
      - name: Install locked dependencies
        working-directory: upstream/frontend
        run: npm ci --no-audit --no-fund
      - name: Install OpenGym coach test dependencies without starting its backend
        working-directory: upstream/api
        run: npm ci --no-audit --no-fund
      - name: Run OpenGym training tests
        working-directory: upstream/frontend
        run: npm test
      - name: Compile real OpenGym React/Vite guest-mode app
        working-directory: upstream/frontend
        env:
          VITE_DEMO: '1'
          VITE_TRIVALLEY_FREE: '1'
        run: npm run build
      - name: Verify self-contained assets and build offline cache
        run: python3 apps/trivalley-opengym/check_dist.py upstream/frontend/dist
      - name: Install free local browser test driver
        run: |
          mkdir -p "$RUNNER_TEMP/trivalley-browser"
          npm install --prefix "$RUNNER_TEMP/trivalley-browser" --no-audit --no-fund puppeteer-core@24 axe-core@4.10.3
          cp apps/trivalley-opengym/browser_smoke.mjs "$RUNNER_TEMP/trivalley-browser/smoke.mjs"
          cp apps/trivalley-opengym/a11y_smoke.mjs "$RUNNER_TEMP/trivalley-browser/a11y.mjs"
          cp apps/trivalley-opengym/v5_smoke.mjs "$RUNNER_TEMP/trivalley-browser/v5.mjs"
          cp apps/trivalley-opengym/poster_smoke.mjs "$RUNNER_TEMP/trivalley-browser/poster.mjs"
          cp apps/trivalley-opengym/programs_smoke.mjs "$RUNNER_TEMP/trivalley-browser/programs.mjs"
          cp apps/trivalley-opengym/movements_smoke.mjs "$RUNNER_TEMP/trivalley-browser/movements.mjs"
          cp apps/trivalley-opengym/setup_smoke.mjs "$RUNNER_TEMP/trivalley-browser/setup.mjs"
          cp apps/trivalley-opengym/navigation_smoke.mjs "$RUNNER_TEMP/trivalley-browser/navigation.mjs"
          cp apps/trivalley-opengym/audit_smoke.mjs "$RUNNER_TEMP/trivalley-browser/audit.mjs"
          cp apps/trivalley-opengym/visuals_smoke.mjs "$RUNNER_TEMP/trivalley-browser/visuals.mjs"
      - name: Test actual mobile Chromium UI, saved plan and offline reload
        if: ${{ !cancelled() }}
        env:
          TV_EXPECT_LIBRARY_V3: '1'
          TV_EXPECT_COMPACT_VERSE: '1'
          TV_EXPECT_V4: '1'
        run: node "$RUNNER_TEMP/trivalley-browser/smoke.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/mobile.png"
      - name: Audit automated WCAG mobile accessibility across training routes
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/a11y.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist"
      - name: Verify guidance, progress, backup confirmation and storage failure in Chromium
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/v5.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/premium.png"
      - name: Verify interactive posters, timed sets and finished-session timestamps
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/poster.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/poster.png"
      - name: Verify ready-made programs, schedule preservation, loads and exercise rest timers
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/programs.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/programs.png"
      - name: Verify owner cover images, program continuation, mobile controls and offline artwork
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/visuals.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/visuals.png"
      - name: Verify exact exercise images, technique cues, accessible references and offline coverage
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/movements.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/movements.png"
      - name: Verify first-user audit fixes in the actual mobile browser
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/audit.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/audit.png"
      - name: Verify reviewed onboarding, calendar relocation and installation help
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/setup.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/setup.png"
      - name: Verify unambiguous setup and nonoverlapping navigation and timers
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trivalley-browser/navigation.mjs" "$GITHUB_WORKSPACE/upstream/frontend/dist" "$RUNNER_TEMP/trivalley-browser/navigation.png"
      - name: Upload mobile browser QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivalley-opengym-mobile-smoke
          path: |
            ${{ runner.temp }}/trivalley-browser/mobile.png
            ${{ runner.temp }}/trivalley-browser/mobile-library.png
            ${{ runner.temp }}/trivalley-browser/premium.png
            ${{ runner.temp }}/trivalley-browser/poster.png
            ${{ runner.temp }}/trivalley-browser/programs.png
            ${{ runner.temp }}/trivalley-browser/visuals.png
            ${{ runner.temp }}/trivalley-browser/visuals-home.png
            ${{ runner.temp }}/trivalley-browser/movements.png
            ${{ runner.temp }}/trivalley-browser/audit.png
            ${{ runner.temp }}/trivalley-browser/setup.png
            ${{ runner.temp }}/trivalley-browser/navigation.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload public-app deployment bundle for Wix
        uses: actions/upload-artifact@v4
        with:
          name: trivalley-opengym-wix-build
          path: upstream/frontend/dist/
          retention-days: 7
          if-no-files-found: error



  client-value:
    name: Client value and mobile layout (${{ matrix.engine }})
    needs: build-open-gym
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: trivalley-opengym-wix-build
          path: client-dist
      - name: Test the actual compiled app in both browser engines
        env:
          TV_ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivalley-client-value"
          npm install --prefix "$RUNNER_TEMP/trivalley-client-value" --no-audit --no-fund playwright-core@1.65.0 axe-core@4.10.3
          cp apps/trivalley-opengym/client_value_smoke.mjs "$RUNNER_TEMP/trivalley-client-value/test.mjs"
          node "$RUNNER_TEMP/trivalley-client-value/test.mjs" "$GITHUB_WORKSPACE/client-dist" "$RUNNER_TEMP/trivalley-client-value/progress.png"
          cp apps/trivalley-opengym/workout_tools_smoke.mjs "$RUNNER_TEMP/trivalley-client-value/workout-tools.mjs"
          node "$RUNNER_TEMP/trivalley-client-value/workout-tools.mjs" "$GITHUB_WORKSPACE/client-dist" "$RUNNER_TEMP/trivalley-client-value/workout-tools.png"
          cp apps/trivalley-opengym/calculators_smoke.mjs "$RUNNER_TEMP/trivalley-client-value/calculators.mjs"
          node "$RUNNER_TEMP/trivalley-client-value/calculators.mjs" "$GITHUB_WORKSPACE/client-dist" "$RUNNER_TEMP/trivalley-client-value/calculators.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivalley-client-value-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/trivalley-client-value/progress.png
            ${{ runner.temp }}/trivalley-client-value/calculators.png
          retention-days: 7

  catalogue-integrity:
    name: Open all 1324 exercise details in mobile Chromium
    needs: build-open-gym
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: trivalley-opengym-wix-build
          path: catalogue-dist
      - name: Check every rendered exercise and coaching coverage
        run: |
          mkdir -p "$RUNNER_TEMP/trivalley-catalogue"
          npm install --prefix "$RUNNER_TEMP/trivalley-catalogue" --no-audit --no-fund puppeteer-core@24
          cp apps/trivalley-opengym/catalogue_smoke.mjs "$RUNNER_TEMP/trivalley-catalogue/test.mjs"
          node "$RUNNER_TEMP/trivalley-catalogue/test.mjs" "$GITHUB_WORKSPACE/catalogue-dist" "$RUNNER_TEMP/trivalley-catalogue/catalogue.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivalley-complete-catalogue
          path: ${{ runner.temp }}/trivalley-catalogue/catalogue.png
          retention-days: 7
