name: Global Intelligence Desk — free Cloudflare static deployment

on:
  push:
    branches: [main]
    paths:
      - "intel-desk/**"
      - "scripts/intel_desk_ingest.py"
      - "tests/test_intel_desk.py"
      - ".github/workflows/global-intel-cloudflare.yml"
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivalley-global-intel-public-static
  cancel-in-progress: false

jobs:
  free-static-publication:
    if: github.ref == 'refs/heads/main'
    environment: osint-forensics-production
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline validation
        run: |
          python3 -m unittest discover -s tests -p 'test_intel_desk.py' -v
          node --check intel-desk/app.js
      - name: Refresh public-source evidence metadata
        run: |
          python3 scripts/intel_desk_ingest.py --output intel-desk/data/events.json
          python3 - <<'PY'
          import json
          p=json.load(open('intel-desk/data/events.json', encoding='utf-8'))
          assert p['schema']=='trivalley.global-intel.v1'
          assert len(p['events'])>0
          for s in p['source_health']:
              print(s['name'],s['state'],s['count'],s.get('error',''))
          print('SNAPSHOT_STATUS',p['status'],'EVENTS',len(p['events']))
          PY
      - name: Preserve source coverage as GitHub evidence
        uses: actions/upload-artifact@v4
        with:
          name: intel-desk-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: intel-desk/data/events.json
          retention-days: 3
          if-no-files-found: error
      - name: Verify no-charge deployment path and existing scoped credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account variable unavailable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare deployment token unavailable"; exit 1; }
          test "$(python3 -c 'import json; print(json.load(open("intel-desk/wrangler.jsonc"))["name"])')" = "trivalley-global-intel"
          echo "Static assets only, no Worker script, no paid AI and no extra hosting subscription"
      - name: Deploy isolated Cloudflare Worker static assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 deploy --config intel-desk/wrangler.jsonc
      - name: Verify the published snapshot (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          url="https://trivalley-global-intel.2strongtrainers.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 \
              "$url/data/events.json" -o "$RUNNER_TEMP/live-intel.json"; then
              if python3 - "$RUNNER_TEMP/live-intel.json" <<'PY'
          import sys,json,datetime
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='trivalley.global-intel.v1'
          stamp=datetime.datetime.fromisoformat(p['generated_at'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-stamp).total_seconds()
          assert 0 <= age < 900
          assert len(p['events'])>0
          print('LIVE_INTEL_STATUS',p['status'])
          print('LIVE_INTEL_EVENTS',len(p['events']))
          print('LIVE_INTEL_SOURCE_OK',sum(s['state']=='ok' for s in p['source_health']))
          PY
              then
                echo "LIVE_INTEL_URL=$url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Public snapshot did not pass acceptance"
          exit 1
