name: ARGUS Graph to Chief Gate — deterministic CI
on:
  push:
    branches: [main]
    paths:
      - 'chief_of_staff/argus_graph_gate.py'
      - 'scripts/argus_graph_n8n_gate.js'
      - 'scripts/build_argus_graph_n8n.py'
      - 'scripts/argus_event_graph.py'
      - 'tests/test_argus_graph_gate.py'
      - 'tests/test_argus_graph_n8n_gate.mjs'
      - 'tests/test_argus_event_graph.py'
      - 'tests/fixtures/argus-event-graph.synthetic.json'
      - 'workflows/n8n/argus-graph-chief-gate.json'
      - '.github/workflows/argus-graph-chief-ci.yml'
  pull_request:
    paths:
      - 'chief_of_staff/argus_graph_gate.py'
      - 'scripts/argus_graph_n8n_gate.js'
      - 'scripts/build_argus_graph_n8n.py'
      - 'scripts/argus_event_graph.py'
      - 'tests/test_argus_graph_gate.py'
      - 'tests/test_argus_graph_n8n_gate.mjs'
      - 'tests/test_argus_event_graph.py'
      - 'tests/fixtures/argus-event-graph.synthetic.json'
      - 'workflows/n8n/argus-graph-chief-gate.json'
      - '.github/workflows/argus-graph-chief-ci.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned graph dependency
        run: python -m pip install --disable-pip-version-check -r requirements/argus-event-graph.txt
      - name: Original typed graph QA
        run: python -m unittest discover -s tests -p 'test_argus_event_graph.py' -v
      - name: Python Chief gate QA
        run: python -m unittest discover -s tests -p 'test_argus_graph_gate.py' -v
      - name: n8n workflow drift QA
        run: python scripts/build_argus_graph_n8n.py --check
      - name: Adversarial n8n Code-node QA
        run: node --test tests/test_argus_graph_n8n_gate.mjs
      - name: Synthetic offline Chief acceptance
        run: |
          python chief_of_staff/argus_graph_gate.py tests/fixtures/argus-event-graph.synthetic.json --receipt /tmp/argus-receipt.json --chief-snapshot /tmp/argus-chief.json
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'chief_of_staff')
          import brief
          a=json.load(open('/tmp/argus-receipt.json'))
          b=json.load(open('/tmp/argus-chief.json'))
          assert a['status']=='STRUCTURAL_PASS_REVIEW_REQUIRED'
          assert a['n8n_execution_id'] is None
          assert a['human_analyst_review']=='not_observed'
          assert len(brief.normalize(b)[3])==1
          print('CHIEF_CONTRACT_SYNTHETIC_PASS',a['metrics'])
          PY
