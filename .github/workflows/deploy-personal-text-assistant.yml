name: Deploy Personal Text Assistant (manual, isolated)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter deploy-isolated-worker (source defaults disabled)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-text-assistant-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-isolated-worker'
    environment: personal-text-assistant
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/personal-text-assistant
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify Cloudflare deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTACTS_JSON: ${{ secrets.CONTACTS_JSON }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare deployment token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account ID missing"; exit 1; }
          node scripts/runtime-secrets.mjs --check
      - name: Test and dry-run independent Worker
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run check
          npm test
          npm run dry-run
      - name: Deploy independent Worker (no live replies by default)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Install runtime secrets on the deployed independent Worker
        # Only reached after successful deployment. JSON goes to pinned Wrangler via stdin.
        # Requires a token scoped to this existing Worker's immutable ID, with no creation permission.
        # Secret updates can create/deploy configuration versions; no activation flag is changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTACTS_JSON: ${{ secrets.CONTACTS_JSON }}
        run: node scripts/runtime-secrets.mjs --install

