name: Deploy AI Switchboard From Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-ai-switchboard.yml"
      - "services/ai-switchboard/src/**"
      - "hermes/tool_registry/websurfers/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Enforce trusted main-only deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -s)" = "Darwin"
          test -f "$GITHUB_WORKSPACE/scripts/deploy_ai_switchboard.sh"
          test -f "$GITHUB_WORKSPACE/services/ai-switchboard/src/tool-routing.ts"
          test -f "$GITHUB_WORKSPACE/services/ai-switchboard/src/atlas.ts"
          test -f "$GITHUB_WORKSPACE/services/ai-switchboard/src/atlas-ui.ts"

      - name: Visible TypeScript check
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/services/ai-switchboard"
          npm install --no-package-lock --no-audit --no-fund
          npm run typecheck

      - name: Prepare checkout-root deploy wrapper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deploy_ai_switchboard_from_checkout.sh"
          python3 - "$GITHUB_WORKSPACE/scripts/deploy_ai_switchboard.sh" "$OUT" <<'PY'
          import sys
          from pathlib import Path

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          root_old = 'ROOT="${HOME}/Nicholas-AI-OS"'
          root_new = 'ROOT="${NICHOLAS_AI_OS_ROOT:-${HOME}/Nicholas-AI-OS}"'
          if src.count(root_old) != 1:
              raise SystemExit("unexpected deploy script root declaration")
          src = src.replace(root_old, root_new, 1)

          start = '# A tiny Ox inference proves the external path end-to-end.'
          end = '# Install/update the local `ai` launcher now that OpenCode is already working.'
          if start not in src or end not in src:
              raise SystemExit("expected external-model probe markers are missing")
          before, rest = src.split(start, 1)
          probe, after = rest.split(end, 1)
          guarded = (
              start + '\n'
              + 'if [[ "${SKIP_EXTERNAL_MODEL_PROBE:-0}" == "1" ]]; then\n'
              + '  echo "OX_LIVE_TEST=SKIPPED_ZERO_SPEND_DEPLOY"\n'
              + 'else\n'
              + probe
              + 'fi\n\n'
              + end
          )
          Path(sys.argv[2]).write_text(before + guarded + after, encoding="utf-8")
          PY
          chmod 700 "$OUT"

      - name: Deploy current main to Cloudflare preserving existing GPT secret
        shell: bash
        run: |
          set -euo pipefail
          NICHOLAS_AI_OS_ROOT="$GITHUB_WORKSPACE" \
          SKIP_EXTERNAL_MODEL_PROBE=1 \
          PRESERVE_EXISTING_SWITCHBOARD_SECRET=1 \
          /bin/zsh "$RUNNER_TEMP/deploy_ai_switchboard_from_checkout.sh"

      - name: Verify live Digital Atlas and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ENV="$HOME/.config/nicholas-ai-switchboard/deployment.env"
          test -f "$DEPLOY_ENV"
          source "$DEPLOY_ENV"

          curl -fsS "$AI_SWITCHBOARD_URL/health" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("tool_routing") is True; assert d.get("atlas") is True; print("SWITCHBOARD_HEALTH=PASS")'

          curl -fsS "$AI_SWITCHBOARD_URL/atlas" > "$RUNNER_TEMP/atlas.html"
          grep -q "Nick’s Digital Atlas" "$RUNNER_TEMP/atlas.html"
          grep -q "Atlas 3.0" "$RUNNER_TEMP/atlas.html"
          grep -q "Find my route" "$RUNNER_TEMP/atlas.html"
          grep -q 'enterkeyhint="search"' "$RUNNER_TEMP/atlas.html"
          grep -q "Why Atlas recommends it" "$RUNNER_TEMP/atlas.html"
          grep -q "Open website" "$RUNNER_TEMP/atlas.html"

          python3 - "$RUNNER_TEMP/atlas.html" "$RUNNER_TEMP/atlas-client.js" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("no Atlas client script found")
          Path(sys.argv[2]).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/atlas-client.js"
          echo "ATLAS_MOBILE_SEARCH_UI=PASS"
          echo "ATLAS_CLIENT_JS_SYNTAX=PASS"

          curl -fsS "$AI_SWITCHBOARD_URL/atlas/catalog" > "$RUNNER_TEMP/atlas-catalog.json"
          python3 - "$RUNNER_TEMP/atlas-catalog.json" <<'PY'
          import json
          import sys
          from urllib.parse import urlparse

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("ok") is True
          assert data.get("count") == 1800, data.get("count")
          tools = data.get("tools") or []
          assert len(tools) == 1800
          assert all(t.get("name") and t.get("url") and urlparse(t["url"]).scheme in ("http", "https") for t in tools)
          sources = set(data.get("sources") or [])
          assert {"AI Tools", "Design & Creative", "Education & Learning", "Gaming"}.issubset(sources), sources
          print("DIGITAL_ATLAS=PASS")
          print("ATLAS_RESOURCE_COUNT=1800")
          PY

          curl -fsS "$AI_SWITCHBOARD_URL/openapi.json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("paths",{}); assert "/tools/route" in p; assert "/ask" in p; print("GPT_ACTION_SCHEMA=PASS")'

          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$AI_SWITCHBOARD_URL/models")"
          test "$CODE" = "401"
          echo "PRIVATE_AUTH_BOUNDARY=PASS"
          echo "DIGITAL_ATLAS_URL=$AI_SWITCHBOARD_URL/atlas"

      - name: Persist non-secret verified deployment status
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.config/nicholas-ai-switchboard/deployment.env"
          mkdir -p status
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$AI_SWITCHBOARD_URL/atlas" > status/ai-switchboard-deployment.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          print(json.dumps({
              "status": "verified",
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "deployed_commit": sys.argv[1],
              "workflow_run_id": sys.argv[2],
              "service": "nicholas-ai-switchboard",
              "digital_atlas": "verified",
              "digital_atlas_ui": "3.0",
              "atlas_mobile_search": "verified",
              "digital_atlas_url": sys.argv[3],
              "gpt_action_schema": "verified",
              "private_auth_boundary": "verified",
              "catalog_resources": 1800,
              "metered_model_probe": "skipped",
              "secrets_recorded": False
          }, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ai-switchboard-deployment.json
          git commit -m "AI switchboard deployment: verified" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record deployment summary
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.config/nicholas-ai-switchboard/deployment.env"
          echo "AI_SWITCHBOARD_DEPLOY=PASS"
          echo "DIGITAL_ATLAS=PASS"
          echo "DIGITAL_ATLAS_UI=3.0"
          echo "ATLAS_MOBILE_SEARCH=PASS"
          echo "DIGITAL_ATLAS_URL=$AI_SWITCHBOARD_URL/atlas"
          echo "PRIVATE_AUTH_BOUNDARY=PASS"
          echo "METERED_MODEL_PROBE=SKIPPED"
