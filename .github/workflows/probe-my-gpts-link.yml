name: Probe My GPTs Link

on:
  push:
    paths:
      - '.github/workflows/probe-my-gpts-link.yml'
      - 'scripts/probe_my_gpts_link.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Inspect My GPTs link target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_my_gpts_link.py"
      - name: Commit My GPTs link status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/my-gpts-link.json
          git commit -m 'Record My GPTs link target' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
