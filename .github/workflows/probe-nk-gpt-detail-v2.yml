name: Probe NK GPT Detail V2

on:
  push:
    paths:
      - '.github/workflows/probe-nk-gpt-detail-v2.yml'
      - 'scripts/probe_nk_gpt_detail_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect NK GPT via proven navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_nk_gpt_detail_v2.py"
      - name: Commit NK detail v2 status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/nk-gpt-detail-v2.json
          git commit -m 'Record NK GPT detail v2 inspection' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
