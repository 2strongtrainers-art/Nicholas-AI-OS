name: Test MoneyPrinter Fast Reel

on:
  push:
    paths:
      - 'scripts/openmontage_moneyprinter.py'
      - 'scripts/openmontage_worker.py'
      - 'tests/test_openmontage_moneyprinter.py'
      - '.github/workflows/test-moneyprinter-fast-reel.yml'
  pull_request:
    paths:
      - 'scripts/openmontage_moneyprinter.py'
      - 'scripts/openmontage_worker.py'
      - 'tests/test_openmontage_moneyprinter.py'
      - '.github/workflows/test-moneyprinter-fast-reel.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile integration modules
        run: |
          python -m py_compile scripts/openmontage_moneyprinter.py scripts/openmontage_worker.py
      - name: Run unit tests
        run: |
          python -m unittest tests.test_openmontage_moneyprinter -v

  strict-news-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'proof/moneyprinter-news-aug24'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
        with:
          ref: proof/moneyprinter-news-aug24
          fetch-depth: 2

      - name: Reuse completed proof when already committed
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if [ -s generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.mp4 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate exact August Nick narration
        if: steps.existing.outputs.ready != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export AUGUST_SCRIPT="$(cat proof/news-script.txt)"
          python3 - <<'PY'
          import json, os, urllib.request
          voice = 'eZ6srIcJSJNcqcDrI68r'
          text = os.environ['AUGUST_SCRIPT'].strip()
          payload = {
              'text': text,
              'model_id': 'eleven_multilingual_v2',
              'voice_settings': {
                  'stability': 0.40,
                  'similarity_boost': 0.85,
                  'style': 0.0,
                  'use_speaker_boost': True,
                  'speed': 1.03,
              },
          }
          req = urllib.request.Request(
              f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'xi-api-key': os.environ['ELEVENLABS_API_KEY'],
                  'Content-Type': 'application/json',
                  'Accept': 'audio/mpeg',
              },
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              audio = response.read()
          if len(audio) < 10000:
              raise SystemExit('August Nick MP3 is unexpectedly small')
          open('august-news.mp3', 'wb').write(audio)
          print(f'generated August Nick bytes={len(audio)}')
          PY
          ffprobe -v error -show_entries format=duration,size -of json august-news.mp3

      - name: Fetch and normalize open-license news B-roll
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p broll/source broll/ready
          curl -fL --retry 3 --connect-timeout 20 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ford_assembly_line_(1930).webm' \
            -o broll/source/auto.webm
          curl -fL --retry 3 --connect-timeout 20 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Oil_tanker_Niovi_seized_by_Iran%27s_Islamic_Revolutionary_Guard_Corps_Navy.webm" \
            -o broll/source/iran.webm
          curl -fL --retry 3 --connect-timeout 20 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sun-sunchronous_orbit_of_AI_data_centers.webm' \
            -o broll/source/ai.webm
          curl -fL --retry 3 --connect-timeout 20 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Inside_Waymo%2C_DTLA%2C_Jan_2026.webm' \
            -o broll/source/ev.webm

          make_clip() {
            src="$1"; start="$2"; out="$3"
            ffmpeg -y -hide_banner -loglevel error -ss "$start" -i "$src" -t 8 \
              -vf 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=24' \
              -an -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p -movflags +faststart "$out"
          }
          make_clip broll/source/auto.webm 10 broll/ready/01-auto.mp4
          make_clip broll/source/iran.webm 5 broll/ready/02-iran.mp4
          make_clip broll/source/ai.webm 2 broll/ready/03-ai.mp4
          make_clip broll/source/ev.webm 1 broll/ready/04-ev.mp4

      - name: Install pinned MoneyPrinterTurbo
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/harry0703/MoneyPrinterTurbo.git MoneyPrinterTurbo
          cd MoneyPrinterTurbo
          git checkout --detach 110997c15abd1660b00add8e41feefedb3df6a8c
          python3 -m pip install --disable-pip-version-check uv
          python3 -m uv python install 3.11
          python3 -m uv sync --frozen
          cp config.example.toml config.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('config.toml')
          text = p.read_text()
          text = re.sub(r'(?m)^subtitle_provider\s*=.*$', 'subtitle_provider = "whisper"', text)
          text = re.sub(r'(?m)^model_size\s*=.*$', 'model_size = "base"', text, count=1)
          text = re.sub(r'(?m)^device\s*=.*$', 'device = "cpu"', text, count=1)
          text = re.sub(r'(?m)^compute_type\s*=.*$', 'compute_type = "int8"', text, count=1)
          p.write_text(text)
          PY

      - name: Render with MoneyPrinterTurbo only
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          SCRIPT="$(cat proof/news-script.txt)"
          cd MoneyPrinterTurbo
          set +e
          .venv/bin/python cli.py \
            --video-script "$SCRIPT" \
            --video-source local \
            --video-materials "$ROOT/broll/ready/01-auto.mp4,$ROOT/broll/ready/02-iran.mp4,$ROOT/broll/ready/03-ai.mp4,$ROOT/broll/ready/04-ev.mp4" \
            --video-aspect 9:16 \
            --video-count 1 \
            --video-clip-duration 4 \
            --video-concat-mode sequential \
            --match-materials-to-script \
            --custom-audio-file "$ROOT/august-news.mp3" \
            --bgm-type none \
            --subtitle-enabled \
            --subtitle-position center \
            --font-size 68 \
            --stroke-width 2 \
            --stop-at video 2>&1 | tee "$ROOT/moneyprinter-proof.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -200 "$ROOT/moneyprinter-proof.log"
            exit "$status"
          fi
          FINAL="$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$FINAL"
          test -s "$FINAL"
          mkdir -p "$ROOT/generated/video"
          cp "$FINAL" "$ROOT/generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.mp4"
          SRT="$(find storage/tasks -type f -name 'subtitle.srt' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$SRT"
          grep -Eiq 'Canada|Canadian' "$SRT"
          grep -Eiq 'Alibaba|Wan' "$SRT"
          grep -Eiq 'Tesla|vehicle' "$SRT"
          cp "$SRT" "$ROOT/generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.srt"

      - name: Validate final video and record provenance
        shell: bash
        run: |
          set -euo pipefail
          VIDEO='generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.mp4'
          test -s "$VIDEO"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration,size -of json "$VIDEO" | tee generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.ffprobe.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          video = Path('generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.mp4')
          data = json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','stream=codec_type,codec_name,width,height',
              '-show_entries','format=duration,size','-of','json',str(video)
          ]))
          video_stream = next(s for s in data['streams'] if s.get('codec_type') == 'video')
          audio_streams = [s for s in data['streams'] if s.get('codec_type') == 'audio']
          assert video_stream.get('codec_name') == 'h264', video_stream
          assert (int(video_stream.get('width',0)), int(video_stream.get('height',0))) == (1080,1920), video_stream
          duration = float(data['format']['duration'])
          assert 15 <= duration <= 90, duration
          assert audio_streams, 'final video has no audio stream'
          manifest = {
              'engine': 'MoneyPrinterTurbo 1.3.5',
              'upstream_commit': '110997c15abd1660b00add8e41feefedb3df6a8c',
              'voice': 'August Nick / ElevenLabs voice eZ6srIcJSJNcqcDrI68r',
              'script_file': 'proof/news-script.txt',
              'subtitle_model': 'Whisper base / CPU int8',
              'fallback_used': False,
              'qa': {'codec':'h264','width':1080,'height':1920,'duration_seconds':duration,'audio_stream':True},
              'broll': [
                  {'source':'Wikimedia Commons — Ford assembly line(1930).webm','license':'Public domain (U.S.)'},
                  {'source':'Wikimedia Commons — Oil tanker Niovi seized by Iran IRGC Navy.webm','license':'U.S. Navy public domain'},
                  {'source':'Wikimedia Commons — Sun-sunchronous orbit of AI data centers.webm','license':'CC0'},
                  {'source':'Wikimedia Commons — Inside Waymo, DTLA, Jan 2026.webm','license':'CC0'},
              ],
          }
          Path('generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY

      - name: Commit finished proof to proof branch
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.mp4 \
                  generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.srt \
                  generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.ffprobe.json \
                  generated/video/Nick-Aug24-News-MoneyPrinter-Full-Proof.manifest.json
          git commit -m 'Publish strict MoneyPrinter Aug 24 news proof'
          git push origin HEAD:proof/moneyprinter-news-aug24
