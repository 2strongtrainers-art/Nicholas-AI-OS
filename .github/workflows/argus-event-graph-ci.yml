name: ARGUS Event Graph Integrity
on:
  push:
    paths:
      - 'scripts/argus_event_graph.py'
      - 'tests/test_argus_event_graph.py'
      - 'tests/fixtures/argus-event-graph.synthetic.json'
      - 'requirements/argus-event-graph.txt'
      - '.github/workflows/argus-event-graph-ci.yml'
  pull_request:
    paths:
      - 'scripts/argus_event_graph.py'
      - 'tests/test_argus_event_graph.py'
      - 'tests/fixtures/argus-event-graph.synthetic.json'
      - 'requirements/argus-event-graph.txt'
      - '.github/workflows/argus-event-graph-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned open-source graph library
        run: python -m pip install --disable-pip-version-check -r requirements/argus-event-graph.txt
      - name: Unit tests and adversarial relationship regressions
        run: python -m unittest discover -s tests -p 'test_argus_event_graph.py' -v
      - name: Verify synthetic fixture and directed GraphML export
        run: |
          python scripts/argus_event_graph.py tests/fixtures/argus-event-graph.synthetic.json --graphml /tmp/argus-synthetic.graphml
          test -s /tmp/argus-synthetic.graphml
