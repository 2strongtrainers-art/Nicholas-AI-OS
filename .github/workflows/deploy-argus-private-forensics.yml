name: Deploy ARGUS Private Forensics

on:
  workflow_dispatch:
    inputs:
      verify_existing:
        description: Test the existing Worker without deploying or updating its secret
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'services/osint-forensics/**'
      - '.github/workflows/deploy-argus-private-forensics.yml'

permissions:
  contents: read

concurrency:
  group: argus-private-forensics
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-argus]'))
    environment: osint-forensics-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ !inputs.verify_existing && secrets.CLOUDFLARE_API_TOKEN || '' }}
      ARGUS_FORENSICS_API_KEY: ${{ secrets.ARGUS_FORENSICS_API_KEY }}
      ARGUS_FORENSICS_URL: ${{ vars.ARGUS_FORENSICS_URL || (inputs.verify_existing && 'https://argus-prime-forensics.2strongtrainers.workers.dev') || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: ${{ !inputs.verify_existing }}
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Confirm deployment configuration before any spend
        if: ${{ !inputs.verify_existing }}
        shell: bash
        run: |
          set -eu
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare deployment token missing"; exit 1; }
          test "$(printf %s "$ARGUS_FORENSICS_API_KEY" | wc -c)" -ge 32 || { echo "Independent forensic secret missing"; exit 1; }
      - name: Unit tests, synthetic data only
        if: ${{ !inputs.verify_existing }}
        run: |
          python -m unittest discover -s tests -p 'test_osint_forensics.py' -v
          python -m unittest discover -s tests -p 'test_osint_http.py' -v
      - name: Build and check the network-disabled container
        if: ${{ !inputs.verify_existing }}
        run: |
          docker build --pull -f services/osint-forensics/Dockerfile -t argus-osint:private-ci services/osint-forensics
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            argus-osint:private-ci python /opt/argus/http_server.py --self-test
      - name: Deploy separate Cloudflare Container Worker
        if: ${{ !inputs.verify_existing }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.141.0 deploy --config services/osint-forensics/wrangler.jsonc | tee /tmp/argus-deploy.log
          if [ -z "$ARGUS_FORENSICS_URL" ]; then
            url=$(grep -Eo 'https://[A-Za-z0-9.-]+[.]workers[.]dev' /tmp/argus-deploy.log | tail -n 1 || true)
            if [ -z "$url" ]; then
              echo "Worker deployed, but live URL could not be verified. Configure ARGUS_FORENSICS_URL and rerun."; exit 1
            fi
            echo "ARGUS_FORENSICS_URL=$url" >> "$GITHUB_ENV"
          fi
      - name: Provision the Worker secret without logging it
        if: ${{ !inputs.verify_existing }}
        shell: bash
        run: |
          set -eu
          printf '%s' "$ARGUS_FORENSICS_API_KEY" |
            npx --yes wrangler@4.141.0 secret put ARGUS_FORENSICS_API_KEY \
            --config services/osint-forensics/wrangler.jsonc >/dev/null
      - name: Verify live authentication and synthetic evidence
        if: ${{ always() }}
        env:
          ARGUS_RECEIPT_PATH: ${{ runner.temp }}/argus-verification/receipt.json
          ARGUS_PREREQUISITES_PASSED: ${{ job.status == 'success' }}
        run: python services/osint-forensics/verify_cloudflare.py
      - name: Preserve the sanitized synthetic verification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: argus-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/argus-verification/receipt.json
          if-no-files-found: error
          retention-days: 14
