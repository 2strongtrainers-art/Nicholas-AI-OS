name: Update Nick's Assistant via Chrome

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/nicks-assistant-update.trigger"

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Update existing GPT through trusted Chrome control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/update_nicks_assistant_via_trusted_chrome.py"

      - name: Commit redacted update status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/nicks-assistant-chrome-update.json
          git commit -m 'Record Nick Assistant Chrome update result' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
