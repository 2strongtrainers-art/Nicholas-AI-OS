name: TriValley Creator CI

on:
  pull_request:
    paths:
      - 'scripts/render_trivalley_lesson.py'
      - 'scripts/trivalley_creator_preflight.py'
      - 'tests/test_trivalley_creator.py'
      - '.github/workflows/trivalley-creator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_PAID_AI: 'false'
      ALLOW_OUTBOUND_SEND: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install Pillow==11.3.0
      - name: Validate policy and render a synthetic fixture
        run: python -m unittest discover -s tests -p 'test_trivalley_creator.py' -v
