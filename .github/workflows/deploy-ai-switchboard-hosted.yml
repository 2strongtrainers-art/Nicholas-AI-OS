name: Deploy AI Switchboard on GitHub

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: switchboard-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: switchboard-production
    defaults:
      run:
        working-directory: services/ai-switchboard
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install and verify the exact source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Check for competing Switchboard deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in deploy-ai-switchboard.yml deploy-hermes-http-endpoint.yml recover-mac-ai-switchboard.yml; do
            for state in queued in_progress waiting pending requested; do
              count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f status="$state" --jq '.total_count')"
              if [[ "$count" != 0 ]]; then
                echo "::error::$workflow has $state runs. Resolve them before deploying from GitHub."
                exit 1
              fi
            done
          done
      - name: Deploy with existing Cloudflare bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ../../scripts/deploy_switchboard_hosted.py
