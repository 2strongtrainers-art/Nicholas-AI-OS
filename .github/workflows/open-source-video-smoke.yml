name: CPU-only open-source video smoke

on:
  pull_request:
    paths:
      - "research/open-source-alternatives-2026-11/**"
      - ".github/workflows/open-source-video-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free rendering dependencies
        run: |
          python -m pip install "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Test local ComfyUI client protocol (mock server; no GPU)
        run: python -m unittest discover -s research/open-source-alternatives-2026-11 -p "test_*.py" -v
      - name: Render vertical smoke video without Higgsfield
        run: >
          python research/open-source-alternatives-2026-11/portable_smoke.py
          --output "$RUNNER_TEMP/trivalley-open-source-smoke.mp4"
          --seconds-per-card 0.8
      - name: Verify H.264 dimensions
        run: |
          video="$RUNNER_TEMP/trivalley-open-source-smoke.mp4"
          test -s "$video"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$video" | grep -x "h264,720,1280"
      - name: Upload non-sensitive artifact for owner review
        uses: actions/upload-artifact@v4
        with:
          name: trivalley-open-source-smoke
          path: ${{ runner.temp }}/trivalley-open-source-smoke.mp4
          retention-days: 7
