name: ElevenLabs Demo Audio

on:
  push:
    paths:
      - 'jobs/elevenlabs-demo-current.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate August Nick narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          job=json.load(open('jobs/elevenlabs-demo-current.json', encoding='utf-8'))
          voice='eZ6srIcJSJNcqcDrI68r'
          payload={
            'text':job['script'],
            'model_id':'eleven_multilingual_v2',
            'voice_settings':{
              'stability':0.45,
              'similarity_boost':0.85,
              'style':0.20,
              'use_speaker_boost':True,
              'speed':1.10
            }
          }
          req=urllib.request.Request(
            f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',
            data=json.dumps(payload).encode(),
            method='POST',
            headers={'xi-api-key':os.environ['ELEVENLABS_API_KEY'],'Content-Type':'application/json','Accept':'audio/mpeg'}
          )
          with urllib.request.urlopen(req, timeout=90) as r:
            open('august-nick-elevenlabs-demo.mp3','wb').write(r.read())
          PY
      - name: Upload narration to Wix Media
        run: |
          python3 - <<'PY'
          import json, urllib.request
          job=json.load(open('jobs/elevenlabs-demo-current.json', encoding='utf-8'))
          data=open('august-nick-elevenlabs-demo.mp3','rb').read()
          req=urllib.request.Request(job['upload_url'], data=data, method='PUT', headers={'Content-Type':'audio/mpeg'})
          with urllib.request.urlopen(req, timeout=90) as r:
            print(r.read().decode('utf-8','replace'))
          PY
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-demo-${{ github.run_id }}
          path: august-nick-elevenlabs-demo.mp3
