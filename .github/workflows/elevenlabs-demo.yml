name: ElevenLabs Demo Audio

on:
  push:
    paths:
      - 'jobs/elevenlabs-demo-current.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate August Nick narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          job=json.load(open('jobs/elevenlabs-demo-current.json', encoding='utf-8'))
          voice='eZ6srIcJSJNcqcDrI68r'
          payload={
            'text':job['script'],
            'model_id':'eleven_multilingual_v2',
            'voice_settings':{
              'stability':0.45,
              'similarity_boost':0.85,
              'style':0.20,
              'use_speaker_boost':True,
              'speed':1.10
            }
          }
          req=urllib.request.Request(
            f'https://api.elevenlabs.io/v1/text-to-speech/{voice}?output_format=mp3_44100_128',
            data=json.dumps(payload).encode(),
            method='POST',
            headers={'xi-api-key':os.environ['ELEVENLABS_API_KEY'],'Content-Type':'application/json','Accept':'audio/mpeg'}
          )
          with urllib.request.urlopen(req, timeout=90) as r:
            os.makedirs('public', exist_ok=True)
            open('public/august-nick-elevenlabs-demo.mp3','wb').write(r.read())
          PY
      - name: Commit hosted narration
        run: |
          git config user.name "Nicholas AI OS"
          git config user.email "2strongtrainers@gmail.com"
          git add public/august-nick-elevenlabs-demo.mp3
          git commit -m "Host August Nick ElevenLabs demo audio" || exit 0
          git push
      - name: Upload audio artifact
        uses: actions/upload-artifact@v6
        with:
          name: elevenlabs-demo-${{ github.run_id }}
          path: public/august-nick-elevenlabs-demo.mp3
