name: Personal AI Text Assistant CI

on:
  pull_request:
    paths:
      - "services/personal-text-assistant/**"
      - ".github/workflows/personal-text-assistant-ci.yml"
      - ".github/workflows/deploy-personal-text-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-isolated-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Static and deterministic tests (no external requests)
        working-directory: services/personal-text-assistant
        run: |
          npm run check
          npm test
      - name: Wrangler compile only - no deployment
        working-directory: services/personal-text-assistant
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run dry-run
