name: Inspect ChatGPT GPT Editor Access

on:
  push:
    paths:
      - ".github/workflows/inspect-chatgpt-gpt-editor-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Inspect Safari and UI automation availability
        shell: bash
        run: |
          set -euo pipefail
          UI_ENABLED="$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || echo false)"
          echo "MAC_UI_AUTOMATION_ENABLED=$UI_ENABLED"
          if pgrep -x Safari >/dev/null 2>&1; then
            echo "SAFARI_RUNNING=1"
          else
            echo "SAFARI_RUNNING=0"
          fi

          /usr/bin/open -a Safari 'https://chatgpt.com/gpts'
          sleep 6
          RAW_URL="$(/usr/bin/osascript -e 'tell application "Safari" to return URL of front document' 2>/dev/null || true)"
          python3 - "$RAW_URL" <<'PY'
          import sys, urllib.parse
          raw=sys.argv[1].strip()
          try:
              u=urllib.parse.urlparse(raw)
          except Exception:
              u=None
          host=(u.hostname or '') if u else ''
          path=(u.path or '') if u else ''
          print('CHATGPT_PAGE_HOST=' + host)
          print('CHATGPT_GPTS_PAGE=' + ('PASS' if host in {'chatgpt.com','www.chatgpt.com'} and path.startswith('/gpts') else 'FAIL'))
          PY

          if [[ "$UI_ENABLED" = "true" ]]; then
            echo "CHATGPT_EDITOR_UI_CONTROL=POSSIBLE"
          else
            echo "CHATGPT_EDITOR_UI_CONTROL=BLOCKED_BY_MAC_ACCESSIBILITY"
          fi
