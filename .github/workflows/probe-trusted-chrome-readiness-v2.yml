name: Probe Trusted Chrome Readiness V2

on:
  push:
    paths:
      - '.github/workflows/probe-trusted-chrome-readiness-v2.yml'
      - 'scripts/probe_trusted_chrome_readiness_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Strict readiness probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_trusted_chrome_readiness_v2.py"
      - name: Commit strict readiness status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/trusted-chrome-readiness-v2.json
          git commit -m 'Record strict trusted Chrome readiness result' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
