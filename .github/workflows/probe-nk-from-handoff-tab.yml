name: Probe NK From Handoff Tab

on:
  push:
    paths:
      - '.github/workflows/probe-nk-from-handoff-tab.yml'
      - 'scripts/probe_nk_from_handoff_tab.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect NK from preserved My GPTs tab
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_nk_from_handoff_tab.py"
      - name: Commit handoff-tab status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/nk-from-handoff-tab.json
          git commit -m 'Record NK handoff-tab inspection' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
