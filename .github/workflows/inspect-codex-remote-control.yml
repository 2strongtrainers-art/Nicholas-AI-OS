name: Inspect Codex Remote Control

on:
  push:
    paths:
      - ".github/workflows/inspect-codex-remote-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Inspect Codex control surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          commands=[
            ['codex','remote-control','--help'],
            ['codex','agents','--help'],
            ['codex','app-server','--help'],
            ['codex','exec','--help'],
            ['codex','mcp','list'],
            ['codex','plugin','list'],
            ['codex','features','list'],
          ]
          for cmd in commands:
              print('=== ' + ' '.join(cmd) + ' ===')
              try:
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=20)
                  text=((p.stdout or '')+'\n'+(p.stderr or '')).strip()
                  lines=text.splitlines()[:220]
                  print('\n'.join(lines))
                  print('EXIT=' + str(p.returncode))
              except subprocess.TimeoutExpired as e:
                  text=((e.stdout or '') if isinstance(e.stdout,str) else '') + '\n' + ((e.stderr or '') if isinstance(e.stderr,str) else '')
                  print('\n'.join(text.splitlines()[:220]))
                  print('EXIT=TIMEOUT')
          PY
