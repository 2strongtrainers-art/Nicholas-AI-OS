name: Global Intelligence Desk — validate, ingest, publish

on:
  pull_request:
    paths:
      - "intel-desk/**"
      - "scripts/intel_desk_ingest.py"
      - "scripts/intel_desk_corrob.py"
      - "tests/test_intel_desk.py"
      - "tests/test_intel_desk_corrob.py"
      - "workflows/n8n/global-intel-readonly-handoff.json"
      - ".github/workflows/global-intel-desk.yml"
  push:
    branches: [main]
    paths:
      - "intel-desk/**"
      - "scripts/intel_desk_ingest.py"
      - "scripts/intel_desk_corrob.py"
      - "tests/test_intel_desk.py"
      - "tests/test_intel_desk_corrob.py"
      - ".github/workflows/global-intel-desk.yml"
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: global-intel-evidence-and-pages
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate evidence normalization and verification safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_intel_desk.py' -v
          python3 -m unittest discover -s tests -p 'test_intel_desk_corrob.py' -v
      - name: Validate browser source and JSON bootstrap
        run: |
          node --check intel-desk/app.js
          python3 -m json.tool intel-desk/data/events.json >/dev/null

  refresh-and-publish-if-enabled:
    needs: offline-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh permitted public sources
        run: python3 scripts/intel_desk_ingest.py --output intel-desk/data/events.json
      - name: Prepare conservative cross-publisher review leads and Chief receipt
        run: python3 scripts/intel_desk_corrob.py --input intel-desk/data/events.json --receipt intel-desk/data/review-receipt.json --output intel-desk/data/corroboration.json
      - name: Verify normalized snapshot and publish attribution
        run: |
          python3 -m json.tool intel-desk/data/events.json >/dev/null
          python3 -m json.tool intel-desk/data/review-receipt.json >/dev/null
          python3 -m json.tool intel-desk/data/corroboration.json >/dev/null
          sha256sum intel-desk/data/events.json intel-desk/data/review-receipt.json
          python3 - <<'PY'
          import json
          p=json.load(open("intel-desk/data/events.json",encoding="utf-8"))
          assert p["schema"]=="trivalley.global-intel.v1"
          assert len(p["events"])>0
          assert len(p["source_health"])==11
          r=json.load(open("intel-desk/data/review-receipt.json",encoding="utf-8"))
          assert r["schema"]=="trivalley.global-intel-review.v1"
          assert r["source_generated_at"]==p["generated_at"]
          assert r["source_feed_total"]==len(p["source_health"])
          assert r["paid_provider_calls"]==0 and r["outbound_actions"]==0
          assert r["chief_delivery"]=="normalized_output_prepared; acknowledgment_not_observed"
          c=json.load(open("intel-desk/data/corroboration.json",encoding="utf-8"))
          assert c["schema"]=="trivalley.global-intel-corroboration.v1"
          assert c["receipt_key"]==r["receipt_key"] and c["generated_at"]==p["generated_at"]
          assert r["corroboration"]["cross_publisher_leads"]==len(c["cross_publisher_leads"])
          assert r["corroboration"]["claim_level"]=="LEAD_ONLY_UNVERIFIED"
          assert c["paid_provider_calls"]==0 and c["outbound_actions"]==0
          assert c["approval_state"]=="REVIEW_REQUIRED"
          print("CORROBORATION",c["receipt_key"],"LEADS",len(c["cross_publisher_leads"]),"OFFICIAL",len(c["official_publication_leads"]),"QA",c["counts"]["excluded_by_reason"])
          print("REVIEW_RECEIPT",r["receipt_key"],r["state"],"FAMILIES",r["source_family_count"],"NO_CHIEF_ACK",True)
          print("SNAPSHOT",p["status"],"EVENTS",len(p["events"]),"CANDIDATES",len(p["connections"]))
          for s in p["source_health"]:
              print("SOURCE",s["name"],s["state"],s["count"],s.get("error",""))
          PY
      - name: Preserve snapshot as owner-downloadable evidence even if Pages is disabled
        uses: actions/upload-artifact@v4
        with:
          name: intel-desk-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intel-desk/data/events.json
            intel-desk/data/review-receipt.json
            intel-desk/data/corroboration.json
          retention-days: 7
          if-no-files-found: error
      - name: Detect whether GitHub Pages source is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-mode" 2>/dev/null &&
             grep -Fxq 'workflow' "$RUNNER_TEMP/pages-mode"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages source is GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages not enabled in GitHub Actions mode; snapshot archived but website not published." >> "$GITHUB_STEP_SUMMARY"
            echo "Owner action: repository Settings > Pages > Source > GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages static dashboard
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: intel-desk
      - name: Publish independent dashboard to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
