name: Coinbase Crypto Futures Paper CI

on:
  pull_request:
    paths:
      - 'trading/coinbase_crypto_futures_policy.json'
      - 'trading/coinbase_crypto_futures_paper.py'
      - 'scripts/run_coinbase_crypto_futures_paper_once.py'
      - 'scripts/install_coinbase_crypto_futures_paper.sh'
      - 'scripts/openmontage_trading_stack.py'
      - 'tests/test_coinbase_crypto_futures_paper.py'
      - '.github/workflows/coinbase-crypto-futures-paper-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile \
            trading/coinbase_crypto_futures_paper.py \
            scripts/run_coinbase_crypto_futures_paper_once.py \
            scripts/openmontage_trading_stack.py \
            tests/test_coinbase_crypto_futures_paper.py
          bash -n scripts/install_coinbase_crypto_futures_paper.sh
      - name: Paper futures tests
        run: python -m unittest tests.test_coinbase_crypto_futures_paper -v
      - name: Assert live Coinbase execution is impossible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('trading/coinbase_crypto_futures_policy.json').read_text())
          assert policy['mode'] == 'paper_only'
          assert policy['live_execution_enabled'] is False
          assert policy['accept_trade_permission_api_keys'] is False
          assert policy['public_market_data_only'] is True
          assert float(policy['max_notional_leverage']) <= 2.0

          files = [
              'trading/coinbase_crypto_futures_paper.py',
              'scripts/run_coinbase_crypto_futures_paper_once.py',
              'scripts/install_coinbase_crypto_futures_paper.sh',
              'scripts/openmontage_trading_stack.py',
          ]
          text = '\n'.join(Path(p).read_text() for p in files).lower()
          forbidden = (
              '/orders',
              'create_order',
              'submit_order',
              'market_market_ioc',
              'limit_limit_gtc',
              'trade_permission',
              'coinbase_api_secret',
              'coinbase_api_key',
          )
          hits = [token for token in forbidden if token in text]
          assert not hits, f'live Coinbase trading capability detected: {hits}'
          print('Coinbase crypto futures paper-only boundary verified')
          PY
