name: Probe Nick Assistant GPT Locator V2

on:
  push:
    paths:
      - '.github/workflows/probe-nicks-assistant-gpt-locator-v2.yml'
      - 'scripts/probe_nicks_assistant_gpt_locator_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Locate existing GPT read-only v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_nicks_assistant_gpt_locator_v2.py"
      - name: Commit redacted locator v2 status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/nicks-assistant-gpt-locator-v2.json
          git commit -m 'Record Nick Assistant GPT locator v2 result' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
