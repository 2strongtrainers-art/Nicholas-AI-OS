name: Probe Browser Client Setup Strict

on:
  push:
    paths:
      - '.github/workflows/probe-browser-client-setup-strict.yml'
      - 'scripts/probe_browser_client_setup_strict.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Probe browser client setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/status"
          python3 "$GITHUB_WORKSPACE/scripts/probe_browser_client_setup_strict.py"
      - name: Commit setup status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/browser-client-setup-strict.json
          git commit -m 'Record strict browser client setup result' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
