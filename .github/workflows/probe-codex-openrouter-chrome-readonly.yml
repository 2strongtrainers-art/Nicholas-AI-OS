name: Probe Codex OpenRouter Chrome Readonly

on:
  push:
    paths:
      - ".github/workflows/probe-codex-openrouter-chrome-readonly.yml"
      - "scripts/probe_codex_chrome_readonly.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify trusted Chrome bridge read-only
        shell: bash
        run: python3 scripts/probe_codex_chrome_readonly.py

      - name: Commit read-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/codex-openrouter-chrome-readonly.json
          git commit -m 'Record read-only Codex Chrome harness probe' || exit 0
          for n in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
