name: Deploy Hermes HTTP Endpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-hermes-http-endpoint.yml"
      - "services/ai-switchboard/src/hermes-index.ts"
      - "services/ai-switchboard/src/hermes-jobs.ts"
      - "services/ai-switchboard/wrangler.jsonc"
      - "scripts/deploy_ai_switchboard.sh"
      - "scripts/hermes_switchboard_worker.py"
      - "scripts/install_hermes_switchboard_worker.sh"
      - "scripts/prepare_hermes_deploy.sh"
      - "scripts/resolve_hermes_kv.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5

      - name: Prepare existing Switchboard deploy script for checkout root
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deploy_ai_switchboard_from_checkout.sh"
          python3 - "$GITHUB_WORKSPACE/scripts/deploy_ai_switchboard.sh" "$OUT" <<'PY'
          import sys
          from pathlib import Path

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          root_old = 'ROOT="${HOME}/Nicholas-AI-OS"'
          root_new = 'ROOT="${NICHOLAS_AI_OS_ROOT:-${HOME}/Nicholas-AI-OS}"'
          if src.count(root_old) != 1:
              raise SystemExit("unexpected deploy script root declaration")
          src = src.replace(root_old, root_new, 1)
          Path(sys.argv[2]).write_text(src, encoding="utf-8")
          PY
          chmod 700 "$OUT"

      - name: Deploy base Switchboard while preserving GPT bearer
        shell: bash
        run: |
          set -euo pipefail
          NICHOLAS_AI_OS_ROOT="$GITHUB_WORKSPACE" \
          PRESERVE_EXISTING_SWITCHBOARD_SECRET=1 \
          /bin/zsh "$RUNNER_TEMP/deploy_ai_switchboard_from_checkout.sh"

      - name: Provision persistent Hermes KV binding
        id: kv
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/services/ai-switchboard"
          bash "$GITHUB_WORKSPACE/scripts/prepare_hermes_deploy.sh" "$RUNNER_TEMP/wrangler-hermes.json"
          echo "config=$RUNNER_TEMP/wrangler-hermes.json" >> "$GITHUB_OUTPUT"

      - name: Configure worker-only bearer and deploy Hermes binding
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/services/ai-switchboard"
          CFG="${{ steps.kv.outputs.config }}"
          CONFIG_DIR="$HOME/.config/nicholas-ai-switchboard"
          KEY_FILE="$CONFIG_DIR/hermes-worker.key"
          mkdir -p "$CONFIG_DIR"
          chmod 700 "$CONFIG_DIR"
          if [[ ! -s "$KEY_FILE" ]]; then
            python3 - "$KEY_FILE" <<'PY'
          import secrets, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(secrets.token_urlsafe(48), encoding='utf-8')
          PY
          fi
          chmod 600 "$KEY_FILE"
          HERMES_WORKER_KEY="$(cat "$KEY_FILE")"
          test -n "$HERMES_WORKER_KEY"
          printf '%s' "$HERMES_WORKER_KEY" | npx wrangler secret put HERMES_WORKER_KEY --config "$CFG" > "$RUNNER_TEMP/hermes-worker-secret.log" 2>&1
          unset HERMES_WORKER_KEY
          npx wrangler deploy --config "$CFG" > "$RUNNER_TEMP/hermes-final-deploy.log" 2>&1
          echo "HERMES_WORKER_KEY_FILE_READY=1"

      - name: Install persistent Hermes endpoint Mac worker
        shell: bash
        run: |
          set -euo pipefail
          NICHOLAS_AI_OS_ROOT="$GITHUB_WORKSPACE" /bin/zsh "$GITHUB_WORKSPACE/scripts/install_hermes_switchboard_worker.sh"

      - name: Verify schema, auth barrier, queue, Mac execution, and returned result
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.config/nicholas-ai-switchboard/deployment.env"
          KEY_FILE="$HOME/.config/nicholas-ai-switchboard/hermes-worker.key"
          test -s "$KEY_FILE"
          WORKER_KEY="$(cat "$KEY_FILE")"
          test -n "$WORKER_KEY"

          curl -fsS "$AI_SWITCHBOARD_URL/health" > "$RUNNER_TEMP/hermes-health.json"
          python3 - "$RUNNER_TEMP/hermes-health.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('hermes_jobs') is True
          print('HERMES_HEALTH=PASS')
          PY

          curl -fsS "$AI_SWITCHBOARD_URL/openapi.json" > "$RUNNER_TEMP/hermes-openapi.json"
          python3 - "$RUNNER_TEMP/hermes-openapi.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          paths=data.get('paths', {})
          assert paths['/hermes/jobs']['post']['operationId'] == 'createHermesJob'
          assert paths['/hermes/jobs/{job_id}']['get']['operationId'] == 'getHermesJob'
          assert '/hermes/internal/jobs' not in paths
          assert '/hermes/internal/claim' not in paths
          print('HERMES_OPENAPI=PASS')
          PY

          printf '%s' '{"task":"Return exactly HERMES_HTTP_ENDPOINT_OK. Do not use tools.","timeout_seconds":300}' > "$RUNNER_TEMP/hermes-create.json"

          PUBLIC_CODE="$(curl -sS -o "$RUNNER_TEMP/public-unauth.json" -w '%{http_code}' \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/hermes-create.json" \
            "$AI_SWITCHBOARD_URL/hermes/jobs")"
          test "$PUBLIC_CODE" = "401"
          echo "HERMES_PUBLIC_AUTH_BARRIER=PASS"

          curl -fsS \
            -H "Authorization: Bearer $WORKER_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/hermes-create.json" \
            "$AI_SWITCHBOARD_URL/hermes/internal/jobs" > "$RUNNER_TEMP/hermes-created.json"
          JOB_ID="$(python3 - "$RUNNER_TEMP/hermes-created.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('ok') is True
          job=data.get('job') or {}
          assert job.get('status') == 'queued'
          print(job['id'])
          PY
          )"
          test -n "$JOB_ID"

          # Try an immediate worker cycle, then poll the persistent queue. The
          # LaunchAgent also runs every 30 seconds, so queued/running are normal
          # asynchronous states and must not be treated as immediate failures.
          /usr/bin/python3 "$HOME/.local/share/nicholas-ai/hermes_switchboard_worker.py" || true
          FINAL_STATUS=""
          for attempt in $(seq 1 72); do
            curl -fsS \
              -H "Authorization: Bearer $WORKER_KEY" \
              "$AI_SWITCHBOARD_URL/hermes/internal/jobs/$JOB_ID" > "$RUNNER_TEMP/hermes-result.json"
            FINAL_STATUS="$(python3 - "$RUNNER_TEMP/hermes-result.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('ok') is True
          print((data.get('job') or {}).get('status') or '')
          PY
            )"
            if [[ "$FINAL_STATUS" = "completed" || "$FINAL_STATUS" = "failed" ]]; then
              break
            fi
            sleep 5
          done
          test "$FINAL_STATUS" = "completed"

          python3 - "$RUNNER_TEMP/hermes-result.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('ok') is True
          job=data.get('job') or {}
          assert job.get('status') == 'completed', job
          assert 'HERMES_HTTP_ENDPOINT_OK' in str(job.get('result') or ''), job.get('result')
          assert job.get('profile') == 'research_readonly'
          print('HERMES_ENDPOINT_E2E=PASS')
          PY
          unset WORKER_KEY

      - name: Persist non-secret endpoint status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" > status/hermes-http-endpoint.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          print(json.dumps({
              'status': 'verified',
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'deployed_commit': sys.argv[1],
              'workflow_run_id': sys.argv[2],
              'service': 'nicholas-ai-switchboard',
              'create_operation': 'createHermesJob',
              'result_operation': 'getHermesJob',
              'persistent_store': 'Cloudflare Workers KV',
              'mac_worker': 'com.nicholas.hermes-switchboard-worker',
              'profile': 'research_readonly',
              'gpt_bearer': 'preserved_existing_cloudflare_secret',
              'worker_credential_storage': 'owner_only_local_file',
              'public_auth_barrier_verified': True,
              'internal_routes_exposed_in_openapi': False,
              'secrets_recorded': False,
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/hermes-http-endpoint.json
          git commit -m "Hermes HTTP endpoint: verified" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record summary
        shell: bash
        run: |
          echo "HERMES_HTTP_ENDPOINT=PASS"
          echo "HERMES_CREATE_JOB=PASS"
          echo "HERMES_GET_RESULT=PASS"
          echo "HERMES_MAC_WORKER=PASS"
          echo "GPT_ACTION_BEARER_UNCHANGED=PASS"