<script>
(()=>{
const initialPath=location.pathname.replace(/\/$/,"")||"/";document.documentElement.classList.toggle("tv-offer-page",["/","/home"].includes(initialPath));
const KEY="__tvExperienceRepairV1";if(window[KEY])window[KEY].dispose();
let raf=null,io=null,observedButton=null,timer=null;
const productPath="/product-page/four-week-dumbbell-strength-starter";
function run(){
 if(!document.body)return;
 const path=location.pathname.replace(/\/$/,"")||"/";
 document.documentElement.classList.toggle("tv-offer-page",["/","/home"].includes(path));
 const coaching=path==="/coaching",product=path===productPath;
 document.body.classList.toggle("tv-coaching-page",coaching);
 document.body.classList.toggle("tv-product-page",product);
 const logo=document.querySelector("#SITE_STRUCTURE_WRichText_0 a");if(logo){logo.setAttribute("aria-label","TriValley.Fit home");if(logo.getAttribute("href")!=="https://www.trivalley.fit/")logo.setAttribute("href","https://www.trivalley.fit/");}
 const brandHeading=document.querySelector("#SITE_STRUCTURE_WRichText_0 h1");if(brandHeading)brandHeading.setAttribute("role","presentation");
 const menu=document.querySelector('#SITE_HEADER nav[aria-label="Site"] button');
 if(menu&&!menu.getAttribute("aria-label"))menu.setAttribute("aria-label","Main menu");
 document.querySelectorAll('.MOBILE_ACTIONS_MENU a').forEach(a=>{
  const href=a.getAttribute("href")||"";
  if(href.startsWith("tel:")){a.setAttribute("aria-label","Call TriValley.Fit");if(href!=="tel:+19258990253")a.setAttribute("href","tel:+19258990253");}
  else if(href.startsWith("mailto:"))a.setAttribute("aria-label","Email TriValley.Fit");
  else if(href.includes("maps.apple.com")){a.setAttribute("aria-label","Map of listed training location");if(href.startsWith("http:"))a.setAttribute("href",href.replace("http:","https:"));}
 });
 document.querySelectorAll('#PAGES_CONTAINER h6').forEach(h=>{h.setAttribute("role","heading");h.setAttribute("aria-level","3");});
 const root=document.querySelector('[data-mesh-id="SITE_FOOTERinlineContent-gridContainer"]');
 if(root&&!document.getElementById("tv-site-support")){
  const support=document.createElement("section");support.id="tv-site-support";support.setAttribute("aria-label","Customer support");
  support.innerHTML='<p><strong>TriValley.Fit · Nick Kaplan, NASM CPT &amp; CES</strong></p><nav aria-label="Support links"><a href="mailto:2strongtrainers@gmail.com">Email Nick</a><a href="tel:+19258990253">(925) 899-0253</a><a href="'+productPath+'">Program, access &amp; refunds</a><a href="/coaching">Personal coaching</a><button type="button" id="tv-coaching-finder">Find my coaching path</button></nav><p>Stronger Today. Healthier Tomorrow.</p>';
  root.appendChild(support);
  support.querySelector("button").addEventListener("click",()=>{const launch=document.getElementById("tv-coaching-quiz")?.shadowRoot?.querySelector("button.launch");if(launch)launch.click();else location.href="/coaching";});
 }
 const quizHost=document.getElementById("tv-coaching-quiz");if(quizHost)quizHost.toggleAttribute("data-tv-product",product);
 const quiz=quizHost?.shadowRoot;
 if(quiz&&!quiz.querySelector("#tv-quiz-audit-style")){
  const s=document.createElement("style");s.id="tv-quiz-audit-style";s.textContent='@media(max-width:760px){.launch{display:none!important}}:host([data-tv-product]) .launch{display:none!important}';quiz.appendChild(s);
 }
 if(coaching){
  const copy=document.getElementById("WRchTxt1d");
  if(copy&&copy.dataset.tvAuditCopy!=="1"){
   copy.innerHTML='<p>Get individualized programming, technique feedback and accountability with Nick Kaplan, NASM CPT and CES.</p><p><strong>Online coaching: $497/month.</strong> Enroll directly, then complete your coaching intake.</p><p><strong>Local, hybrid or private coaching:</strong> start with the short application below. There’s no payment on this form. If it’s a fit, you can choose to book the $297 Elite Assessment.</p><p>Nick uses your contact details and goals to respond to this application. Please don’t include medical records or other sensitive information.</p><p>Prefer a self-guided starting plan? Explore the <a href="'+productPath+'" style="color:#e2c476">$39 Dumbbell Starter</a>.</p>';
   copy.dataset.tvAuditCopy="1";
  }
  document.querySelectorAll('#tv-online-coaching-conversion-v1 a').forEach(a=>{if(a.textContent.trim()==="Ask a Question First"&&a.getAttribute("href").indexOf("mailto:")!==0)a.href="mailto:2strongtrainers@gmail.com?subject=Coaching%20question";});
 }
 if(path==="/")document.querySelectorAll('#PAGES_CONTAINER a').forEach(a=>{if(a.textContent.trim()==="See Coaching Options"&&a.getAttribute("href")!=="/coaching")a.setAttribute("href","/coaching");});
 let bar=document.getElementById("tv-mobile-purchase");
 const add=product?document.querySelector('button[data-hook="add-to-cart"]'):null;
 if(!product){if(bar)bar.remove();if(io)io.disconnect();io=null;observedButton=null;}
 if(product&&add){
  if(!document.getElementById("tv-product-clarity")){
   const note=document.createElement("p");note.id="tv-product-clarity";note.textContent="One-time digital program. No subscription. The cover uses an illustration, not a photograph of Nick.";add.parentElement.appendChild(note);
  }
  if(!bar){bar=document.createElement("div");bar.id="tv-mobile-purchase";bar.setAttribute("aria-label","Dumbbell Starter purchase");bar.innerHTML='<span>$39 once</span><button type="button">Add to cart</button>';bar.hidden=true;document.body.appendChild(bar);bar.querySelector("button").addEventListener("click",()=>{const target=document.querySelector('button[data-hook="add-to-cart"]');if(target&&!target.disabled&&target.getAttribute("aria-disabled")!=="true")target.click();});}
  if(observedButton!==add){if(io)io.disconnect();observedButton=add;io=new IntersectionObserver(entries=>{const b=document.getElementById("tv-mobile-purchase");if(b)b.hidden=entries[0].isIntersecting;},{threshold:0.25});io.observe(add);}
  bar.querySelector("button").disabled=add.disabled||add.getAttribute("aria-disabled")==="true";
 }
}
function schedule(){if(raf!==null)return;raf=requestAnimationFrame(()=>{raf=null;run();});}
const customRoots='#tv-dumbbell-starter-v21,#tv-site-support,#tv-mobile-purchase,#tv-online-coaching-conversion-v1';
function changed(records){
 if(!records.some(r=>!(r.target instanceof Element)||!r.target.closest(customRoots)))return;
 if(timer!==null)return;
 timer=setTimeout(()=>{timer=null;schedule();},100);
}
const observer=new MutationObserver(changed);observer.observe(document.documentElement,{childList:true,subtree:true});window.addEventListener("popstate",schedule);
window[KEY]={dispose(){observer.disconnect();window.removeEventListener("popstate",schedule);if(io)io.disconnect();if(raf!==null)cancelAnimationFrame(raf);if(timer!==null)clearTimeout(timer);}};
schedule();
})();
</script>
